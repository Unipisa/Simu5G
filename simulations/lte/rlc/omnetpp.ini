#
# LTE RLC validation scenarios.
#
# The LTE counterpart of simulations/nr/rlc: configurations for exercising and
# quantitatively validating the LTE RLC AM (TS 36.322) implementation, not
# realistic deployments. As there, everything that makes loss rates an emergent
# property of the scenario is stripped away: the channel is ~IdealChannelModel
# with a per-direction error rate on its own RNG (with harqReduction = 1, the
# residual loss RLC sees is exactly perDl^(maxHarqRtx+1)), the uplink is kept
# clean so STATUS delivery is never in question, and the traffic is CBR. See
# simulations/nr/rlc/omnetpp.ini for the full reasoning.
#
# The LTE-specific paths these scenarios add over the NR set: concatenation of
# several SDUs into one AMD PDU (AM-Concatenation), and re-segmentation of a
# retained PDU into AMD PDU segments on retransmission (AM-Segmentation).
#

[General]
abstract = true
sim-time-limit = 20s
network = simu5g.simulations.lte.networks.SingleCell
**.routingRecorder.enabled = false

############### Statistics ##################
# ${iterationvarsf} keeps the parameter-study runs apart; it is empty when a
# configuration has no iteration variables.
output-scalar-file = ${resultdir}/${configname}/${iterationvarsf}${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvarsf}${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

############### Mobility ##################
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = true

############### Radio ##################
**.numBands = 6
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm

############### IPv4 configurator ##################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config Base
#
# Single stationary UE served by one eNB, over the error-rate channel model, with
# the loss process on its own RNG so it is independent of the traffic.
#
[Config Base]
abstract = true

**.numUe = 1
**.ue[*].servingNodeId = 1
**.ue[*].mobility.initFromDisplayString = false
**.ue[*].mobility.typename = "StationaryMobility"
**.mobility.constraintAreaMinX = 300m
**.mobility.constraintAreaMinY = 200m
**.mobility.constraintAreaMaxX = 800m
**.mobility.constraintAreaMaxY = 400m
**.ue[*].mobility.initialX = 400m
**.ue[*].mobility.initialY = 300m

# Replace propagation modelling with a configurable per-direction error rate.
**.channelModelType = "IdealChannelModel"

# Independent HARQ attempts, so the residual loss rate is exactly perDl^(maxHarqRtx+1).
**.harqReduction = 1

# Clean uplink: RLC AM STATUS PDUs are never lost, so the downlink ARQ under test
# is not confounded by a lossy feedback path.
**.perUl = 0
**.perD2D = 0

# Keep the loss process off the traffic source's RNG, so that changing the error
# rate does not change which SDUs are offered.
num-rngs = 2
**.channelModel[*].rng-0 = 1
*.radioMedium.rng-0 = 1

############## Deterministic CBR traffic, downlink ##############
**.ue[*].numApps = 1
**.server.numApps = 1

**.ue[*].app[0].typename = "CbrReceiver"
**.ue[*].app[0].localPort = 3000

**.server.app[0].typename = "CbrSender"
**.server.app[0].destAddress = "ue[0]"
**.server.app[0].destPort = 3000
**.server.app[0].localPort = 3088
**.server.app[0].packetSize = 40B
**.server.app[0].samplingTime = 0.01s   # 100 SDU/s
**.server.app[0].startTime = 1s
# Stop well before the end of the run, so that whatever is in flight or awaiting
# retransmission when the source stops still has time to be delivered.
**.server.app[0].finishTime = 18s
#------------------------------------#


#------------------------------------#
# Config AmBase
#
# As Base, but the packet-classified bearers are carried over RLC AM, so the CBR
# flow lands on an AM bearer whichever traffic class it is mapped to. LTE bearers
# use the LTE AM entities (LteRlcAmEntity) by default.
#
[Config AmBase]
abstract = true
extends = Base

*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, lcg: 3, rlcMode: "AM"}]
#------------------------------------#


#------------------------------------#
# Config AM-Clean
#
# Error-free reference: no HARQ errors, every offered SDU delivered exactly once.
# A single tail retransmission is expected when the source stops (t-PollRetransmit
# expires before the last acknowledgement arrives; the duplicate is discarded).
#
[Config AM-Clean]
extends = AmBase

**.perDl = 0
#------------------------------------#


#------------------------------------#
# Config AM-Lossy
#
# The main quantitative case: with maxHarqRtx = 3 (four attempts) and independent
# attempts, the residual PDU loss reaching RLC is perDl^4 -- 0.0001, 0.0081,
# 0.0625 and 0.2401 for the four points. Expected: every offered SDU delivered
# (the AM guarantee), the measured per-attempt HARQ error rate equal to perDl,
# and the retransmission count rising with perDl^4. maxRtxThreshold is raised so
# the top of the sweep stays in the ARQ-repair regime instead of legitimately
# failing the link (radio link failure is exercised in AM-RLF).
#
[Config AM-Lossy]
extends = AmBase

**.perDl = ${perDl = 0.1, 0.3, 0.5, 0.7}
**.maxRtxThreshold = 32
#------------------------------------#


#------------------------------------#
# Config AM-Concatenation
#
# The LTE-specific data path: many small SDUs arriving faster than the per-SDU
# grant service, so the transmitter concatenates several SDUs into one AMD PDU
# (TS 36.322 5.1.3.1.1) and single PDU losses cost several SDUs, which the ARQ
# must recover together.
#
# Expected: fewer PDUs sent than SDUs offered (concatenation), and every SDU
# delivered despite the losses.
#
[Config AM-Concatenation]
extends = AmBase

**.server.app[0].packetSize = 20B
**.server.app[0].samplingTime = 0.002s   # 500 SDU/s in bursts
**.perDl = 0.3
**.maxRtxThreshold = 32
#------------------------------------#


#------------------------------------#
# Config AM-Segmentation
#
# Exercises fragmentation across PDUs and, on retransmission, re-segmentation of
# a retained PDU into AMD PDU segments: the SDUs are much larger than the grants,
# so each SDU spans several PDUs, and a lost PDU's retransmission may be re-carved
# to a smaller grant.
#
# Expected: every SDU delivered and reassembled intact, with segment
# retransmissions among the retransmitted PDUs.
#
[Config AM-Segmentation]
extends = AmBase

**.server.app[0].packetSize = 1400B
**.server.app[0].samplingTime = 0.02s
**.perDl = 0.4
**.maxRtxThreshold = 32
#------------------------------------#


#------------------------------------#
# Config AM-WindowStall
#
# Drives the transmitter into its window limit without failing the link: a small
# window and a loaded lossy downlink, with the load kept below what the link can
# carry so the stall resolves and the run drains.
#
# Expected: txWindowFull events and the window occupancy reaching the window
# size, but all SDUs eventually delivered.
#
[Config AM-WindowStall]
extends = AmBase

**.AM_Window_Size = 64
**.maxRtxThreshold = 32
**.perDl = 0.5
**.server.app[0].samplingTime = 0.005s   # 200 SDU/s
**.server.app[0].finishTime = 15s        # longer drain: the backlog takes a while to clear
#------------------------------------#


#------------------------------------#
# Config AM-RLF
#
# Radio link failure: the downlink is clean until t = 5s and then fails
# completely. As in the NR scenario, the failure requires the transmit window to
# stall first (each poll expiry reconsiders the highest outstanding SN; only a
# pinned SN lets RETX_COUNT accumulate), so the window is kept small. When
# RETX_COUNT reaches maxRtxThreshold the link is released at both ends
# (TS 36.322 5.2.1); with t311 = 0s (the default) the UE stays released.
#
# Expected: exactly one radio link failure shortly after the window stalls, a
# clean teardown at both ends, and the downlink flow stopping for good.
#
[Config AM-RLF]
extends = AmBase

**.AM_Window_Size = 64
**.maxRtxThreshold = 4
**.perDl = simTime() < 5s ? 0 : 1
#------------------------------------#


#------------------------------------#
# Config AM-RLF-Reestablish
#
# As AM-RLF, but RRC re-establishment is enabled and the downlink comes back at
# t = 12s: after the failure, t311 (cell selection) and t301 run, the peer is
# un-released, and the bearer re-establishes on demand.
#
# Expected: a radio link failure as in AM-RLF, followed by the flow resuming once
# the link is back and the bearer has been re-established.
#
[Config AM-RLF-Reestablish]
extends = AM-RLF

**.perDl = (simTime() < 5s || simTime() >= 12s) ? 0 : 1
**.bearerManagement.t311 = 1s
**.bearerManagement.t301 = 0.1s
#------------------------------------#


#------------------------------------#
# Config UM-Lossy
#
# The contrast case: the same lossy downlink carried over LTE RLC UM, which has
# no ARQ, so the residual perDl^(maxHarqRtx+1) losses are not repaired.
#
[Config UM-Lossy]
extends = Base

**.perDl = ${perDl = 0.1, 0.3, 0.5, 0.7}
#------------------------------------#


#------------------------------------#
# Config AM-Lossy-UL
#
# The uplink mirror of AM-Lossy: the UE transmits the CBR flow, so the UE-side
# AM entity carries data (not only STATUS reports) against the UE MAC's strict
# grant accounting, while the STATUS reports flow on a clean downlink. The
# uplink grant path (RAC/BSR-driven) differs from the downlink one, so this
# exercises scheduling machinery AM-Lossy cannot.
#
# Expected: as AM-Lossy -- every offered SDU delivered, retransmissions rising
# with perUl^(maxHarqRtx+1).
#
[Config AM-Lossy-UL]
extends = AmBase

# reverse the traffic direction
**.ue[*].app[0].typename = "CbrSender"
**.ue[*].app[0].destAddress = "server"
**.ue[*].app[0].destPort = 3000
**.ue[*].app[0].localPort = 3088
**.ue[*].app[0].packetSize = 40B
**.ue[*].app[0].samplingTime = 0.01s
**.ue[*].app[0].startTime = 1s
**.ue[*].app[0].finishTime = 18s
**.server.app[0].typename = "CbrReceiver"
**.server.app[0].localPort = 3000

# lossy uplink data path, clean downlink for the STATUS reports
**.perUl = ${perUl = 0.5}
**.perDl = 0
**.maxRtxThreshold = 32
#------------------------------------#


#------------------------------------#
# Config TCP-AM
#
# TCP file transfer over the AM bearer: the canonical AM use case, and the one
# with bidirectional data on a single bearer -- the TCP acknowledgements travel
# uplink as AM data. The downlink is lossy; RLC AM repairs it below TCP, so the
# transfer must make steady progress without TCP-visible loss.
#
# Expected: the connection completes its handshake, delivers a substantial
# byte count, and neither side wedges.
#
[Config TCP-AM]
extends = AmBase

**.ue[*].app[0].typename = "TcpSinkApp"
**.ue[*].app[0].localPort = 1000
**.server.app[0].typename = "TcpSessionApp"
**.server.app[0].connectAddress = "ue[0]"
**.server.app[0].connectPort = 1000
**.server.app[0].localPort = 1000
**.server.app[0].active = true
**.server.app[0].tOpen = 0.5s
**.server.app[0].tSend = 1s
**.server.app[0].sendBytes = 1GiB
**.server.app[0].tClose = -1s

**.perDl = 0.5
**.maxRtxThreshold = 32
#------------------------------------#
