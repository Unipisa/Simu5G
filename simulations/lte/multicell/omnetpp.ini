[General]
abstract = true
sim-time-limit=20s
network = simu5g.simulations.lte.networks.MultiCell
**.routingRecorder.enabled = false
**.vector-recording = false
seed-set = ${repetition}

**.cellularNic.channelModel[0].downlinkInterference = true

################ Mobility parameters #####################
# *
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = true

############### Number of Resource Blocks ################
**.numBands = 6

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


[Config VoIP]
# Schedulers
**.mac.schedulingDisciplineDl = "MAXCI"
**.mac.schedulingDisciplineUl = "MAXCI"

# one UDP application for each user
*.ue*.numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 4

# connect each UE to the eNB
**.ue1*.servingNodeId = 1
**.ue2*.servingNodeId = 2

# positioning and mobility
*.ue*.mobility.initialMovementHeading = uniform(0deg, 360deg)
*.ue*.mobility.constraintAreaMaxX = 1000m
*.ue*.mobility.constraintAreaMaxY = 1000m
*.ue*.mobility.constraintAreaMinX = 0m
*.ue*.mobility.constraintAreaMinY = 0m
*.ue*.mobility.initFromDisplayString = false
*.ue*.mobility.initialX = uniform(0m,300m)
*.ue*.mobility.initialY = uniform(0m,300m)
*.ue*.mobility.initialZ = 0m
*.ue*.mobility.speed = 0mps
*.ue*.mobility.typename = "LinearMobility"

#============= Application Setup =============
*.ue*.app[*].typename = "VoipReceiver"
*.ue*.app[0].localPort = 3000

*.server.app[*].packetSize = 40B
*.server.app[0].destAddress = "ue11"
*.server.app[1].destAddress = "ue12"
*.server.app[2].destAddress = "ue21"
*.server.app[3].destAddress = "ue22"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].typename = "VoipSender"
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#------------------------------------#
# This configurations tests three types of well-known schedulers, namely DRR,
# MAXCI and PF, in a scenario with VoIP like traffic.
# The load of the system is varied by means of packet size and amount of UEs
# Inter-cell interference is added by means of External cells, allocating resources according to various policies
# The geometry two families share: two anisotropic base stations, two
# anisotropic external cells and four stationary UEs. Abstract, so that what
# varies on top of it -- the external cells' allocation policy in
# InterferenceTest, which contributions are counted in the Interference-*
# family -- is the only thing that distinguishes a run.
[Config InterferenceGeometry]
abstract = true
output-scalar-file = ${resultdir}/${configname}-${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}-${iterationvars}-${repetition}.vec

extends = VoIP
sim-time-limit = 10s
repeat = 1

*.eNodeB*.mobility.initFromDisplayString = false
*.eNodeB1.mobility.initialX = 100m
*.eNodeB1.mobility.initialY = 100m
*.eNodeB2.mobility.initialX = 600m
*.eNodeB2.mobility.initialY = 100m

*.eNodeB*.cellularNic.radio.antenna.txDirection = "ANISOTROPIC"
*.eNodeB1.cellularNic.radio.antenna.txAngle = 45deg
*.eNodeB2.cellularNic.radio.antenna.txAngle = 135deg

*.numExtCells = 2

*.extCell[*].txPower = 20dBm
*.extCell[*].txDirection = "ANISOTROPIC"
*.extCell[*].bandUtilization = 0.5

*.extCell[0].positionX = 100m
*.extCell[0].positionY = 600m
*.extCell[0].txAngle = 315deg

*.extCell[1].positionX = 600m
*.extCell[1].positionY = 600m
*.extCell[1].txAngle = 225deg

*.ue11.mobility.initialX = 150m
*.ue11.mobility.initialY = 150m
*.ue12.mobility.initialX = 250m
*.ue12.mobility.initialY = 250m
*.ue21.mobility.initialX = 550m
*.ue21.mobility.initialY = 150m
*.ue22.mobility.initialX = 450m
*.ue22.mobility.initialY = 250m
*.ue*.mobility.typename = "StationaryMobility"

*.server.numApps = 4
#------------------------------------#


#------------------------------------#
# Config InterferenceTest
#
# The external cells' three allocation policies, over the shared geometry.
#
[Config InterferenceTest]
extends = InterferenceGeometry

*.extCell[*].bandAllocationType = ${extAllocType="FULL_ALLOC","RANDOM_ALLOC","CONTIGUOUS_ALLOC"}
#------------------------------------#

#------------------------------------#
# Config Interference-*
#
# The interference contributions, switched on and off one at a time. Nothing
# else in the suite varies any of them: downlinkInterference is enabled in
# General and never disabled, uplinkInterference is enabled by no
# configuration here at all, and extCellInterference defaults to true and is
# varied nowhere in the project -- so the only external-cell behaviour ever
# exercised was "count every external cell", and the code that decides not to
# was never run.
#
# The geometry is InterferenceTest's: two anisotropic base stations and two
# anisotropic external cells, so a contribution is removed from a scenario in
# which it was really contributing. The allocation type is pinned to
# FULL_ALLOC, because what this family varies is which contributions are
# counted, not how the external cells allocate; the three allocation types are
# covered by InterferenceTest itself.
#
# An uplink flow is added, which VoIP does not have: uplinkInterference only
# reaches a result if there is uplink data to be scheduled against it.
#
[Config Interference-Base]
abstract = true
extends = InterferenceGeometry

# FULL_ALLOC: the external cells occupy every band in every TTI, which is both
# the largest contribution to switch off and the only policy that needs no
# random draw and no TTI tick of its own. What this family varies is which
# contributions are counted, so the interferers should be as steady as
# possible; the three allocation policies are InterferenceTest's subject.
*.extCell[*].bandAllocationType = "FULL_ALLOC"

# Uplink traffic, so that removing the uplink contribution can be felt.
*.ue*.numApps = 2
*.ue*.app[1].typename = "VoipSender"
*.ue*.app[1].destAddress = "server"
*.ue*.app[1].destPort = 4000
*.ue*.app[1].localPort = 4088
*.ue*.app[1].packetSize = 40B
*.ue*.app[1].startTime = uniform(0s,0.02s)
*.server.numApps = 5
*.server.app[4].typename = "VoipReceiver"
*.server.app[4].localPort = 4000

**.downlinkInterference = true
**.uplinkInterference = true
**.extCellInterference = true

[Config Interference-AllOn]
extends = Interference-Base

[Config Interference-NoDownlink]
extends = Interference-Base
**.downlinkInterference = false

[Config Interference-NoUplink]
extends = Interference-Base
**.uplinkInterference = false

[Config Interference-NoExtCell]
extends = Interference-Base
**.extCellInterference = false
#------------------------------------#
