# Regression coverage for the channel-model propagation formulas.
#
# The three 3GPP propagation studies (TR 36.814, TR 36.873 and TR 38.901,
# selected with the channel model's pathLossType parameter or, equivalently,
# with the Tr36873ChannelModel and Tr38901ChannelModel presets) carry
# per-scenario path loss, LOS probability and shadowing formulas, but the
# example simulations leave the scenario at URBAN_MACROCELL and dynamicLos
# at false throughout, so most of those formulas reach no simulation in the
# fingerprint suite. Each configuration here selects one study and one
# deployment scenario, draws LOS from the scenario's probability formula, and
# moves the UE so the LOS state is re-drawn along the trajectory. These are
# regression tests, not examples.
#
# The transmit power of each configuration is chosen so that the received
# signal falls into the CQI-sensitive range over the trajectory: path loss
# differences then reach the scheduler and the traffic, and a regression
# in a formula moves all fingerprint ingredients, not only the statistics.
#
# Deliberately absent:
#  - D2D channel-model coverage: see the ChannelModel-* configurations in
#    simulations/nr/d2d.

[General]
abstract = true
sim-time-limit=20s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50 # this value should be kept equal to the number of RBs

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config Base
#
# One gNB, one UE, Voice-over-IP DL traffic. Same topology and traffic as
# nr/standalone VoIP-DL; the scenario and channel-model mixins below vary the
# propagation while the traffic stays fixed.
#
[Config Base]
abstract = true
network = simu5g.simulations.nr.networks.SingleCell_Standalone

############### e/gNodeB configuration #################
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

############## UE configuration ##################
*.numUe = 1

# connect the UE's NIC to the corresponding serving gNB (NR side only)
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1

# UE position
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m

#============= Application Setup =============
*.ue[*].numApps = 1
*.server.numApps = 1

*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000

*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]"
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].typename = "VoipSender"
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#====================================#
# Propagation study selectors. The default of the gNB NIC and of the
# UE's NR side is Tr38901ChannelModel, so TR 38.901 needs no selector.
#====================================#

#------------------------------------#
# Config Gen36814
#
# TR 36.814 formulas (StochasticChannelModel) on both ends of the NR link.
#
[Config Gen36814]
abstract = true
*.gnb.cellularNic.channelModelType = "StochasticChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "StochasticChannelModel"
#------------------------------------#

#------------------------------------#
# Config Gen36873
#
# TR 36.873 formulas (Tr36873ChannelModel) on both ends of the NR link.
#
[Config Gen36873]
abstract = true
*.gnb.cellularNic.channelModelType = "Tr36873ChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "Tr36873ChannelModel"
#------------------------------------#


#====================================#
# Scenario geometry mixins. Each selects a deployment scenario, enables the
# dynamic LOS draw, and moves the UE so that the draw repeats about every 10m
# of travel, with distances kept inside the validity range of the scenario's
# path loss formulas. The transmit power places the received signal in the
# CQI-sensitive range for that scenario's distances.
#====================================#

#------------------------------------#
# Config InHGeometry
#
# Indoor hotspot. 5mps over 20s = 100m travelled against a 10m correlation
# distance; the UE ends up 114m from the gNB, within the 150m validity limit
# of the indoor-hotspot path loss models.
#
[Config InHGeometry]
abstract = true
extends = Base

**.channelModel[*].scenario = "INDOOR_HOTSPOT"
**.nrChannelModel[*].scenario = "INDOOR_HOTSPOT"
**.channelModel[*].dynamicLos = true
**.nrChannelModel[*].dynamicLos = true

# An indoor-appropriate transmit power. At the default 40dBm the received signal
# stays above the highest CQI over the whole trajectory, so the ~23dB between the
# indoor LOS and NLOS path loss never reaches the traffic and the LOS model shows
# up in the SINR statistics alone.
**.eNodeBTxPower = 0dBm

**.channelModel[*].correlationDistance = 10m
**.nrChannelModel[*].correlationDistance = 10m
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.speed = 5mps
*.ue[0].mobility.initialMovementHeading = 0deg
#------------------------------------#

#------------------------------------#
# Config UMiGeometry
#
# Urban microcell: 10m antenna height, UE from 20m out to ~120m. The LOS
# probability falls from ~0.95 to ~0.2 along the trajectory. The gNB antenna
# coordinate is elevated to the antenna height, so the 3D distance of the
# TR 36.873/38.901 formulas differs from the 2D distance.
#
[Config UMiGeometry]
abstract = true
extends = Base

**.channelModel[*].scenario = "URBAN_MICROCELL"
**.nrChannelModel[*].scenario = "URBAN_MICROCELL"
**.channelModel[*].dynamicLos = true
**.nrChannelModel[*].dynamicLos = true
**.channelModel[*].nodebHeight = 10m
**.nrChannelModel[*].nodebHeight = 10m

**.eNodeBTxPower = -5dBm

**.channelModel[*].correlationDistance = 10m
**.nrChannelModel[*].correlationDistance = 10m
**.mobility.constraintAreaMaxZ = 50m
*.gnb.mobility.initialZ = 10m
*.ue[0].mobility.initialX = 470m
*.ue[0].mobility.initialY = 300m
*.ue[0].mobility.initialZ = 1.5m
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.speed = 5mps
*.ue[0].mobility.initialMovementHeading = 0deg
#------------------------------------#

#------------------------------------#
# Config UMaGeometry
#
# Urban macrocell: default 25m antenna height, UE from 30m out to ~130m. The
# gNB antenna coordinate is elevated to the antenna height, so the 3D distance
# of the TR 36.873/38.901 formulas differs from the 2D distance.
#
[Config UMaGeometry]
abstract = true
extends = Base

**.channelModel[*].scenario = "URBAN_MACROCELL"
**.nrChannelModel[*].scenario = "URBAN_MACROCELL"
**.channelModel[*].dynamicLos = true
**.nrChannelModel[*].dynamicLos = true

**.eNodeBTxPower = -5dBm

**.channelModel[*].correlationDistance = 10m
**.nrChannelModel[*].correlationDistance = 10m
**.mobility.constraintAreaMaxZ = 50m
*.gnb.mobility.initialZ = 25m
*.ue[0].mobility.initialX = 480m
*.ue[0].mobility.initialY = 300m
*.ue[0].mobility.initialZ = 1.5m
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.speed = 5mps
*.ue[0].mobility.initialMovementHeading = 0deg
#------------------------------------#

#------------------------------------#
# Config RMaGeometry
#
# Rural macrocell: vehicular UE from 50m out to ~550m, so both the slow
# TR 36.873/38.901 LOS decay (per-1000m) and the faster TR 36.814 decay
# (per-200m) produce a LOS/NLOS mix along the trajectory.
#
[Config RMaGeometry]
abstract = true
extends = Base

**.channelModel[*].scenario = "RURAL_MACROCELL"
**.nrChannelModel[*].scenario = "RURAL_MACROCELL"
**.channelModel[*].dynamicLos = true
**.nrChannelModel[*].dynamicLos = true

**.eNodeBTxPower = 8dBm
**.mobility.constraintAreaMaxX = 5000m

**.channelModel[*].correlationDistance = 10m
**.nrChannelModel[*].correlationDistance = 10m
**.mobility.constraintAreaMaxZ = 50m
*.gnb.mobility.initialZ = 25m
*.ue[0].mobility.initialX = 500m
*.ue[0].mobility.initialY = 300m
*.ue[0].mobility.initialZ = 1.5m
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.speed = 25mps
*.ue[0].mobility.initialMovementHeading = 0deg
#------------------------------------#

#------------------------------------#
# Config SMaGeometry
#
# Suburban macrocell: vehicular UE from 100m out to ~600m. Only TR 36.814
# implements this scenario; the NR models delegate it to the base class.
#
[Config SMaGeometry]
abstract = true
extends = Base

**.channelModel[*].scenario = "SUBURBAN_MACROCELL"
**.nrChannelModel[*].scenario = "SUBURBAN_MACROCELL"
**.channelModel[*].dynamicLos = true
**.nrChannelModel[*].dynamicLos = true

**.eNodeBTxPower = 8dBm
**.mobility.constraintAreaMaxX = 5000m

**.channelModel[*].correlationDistance = 10m
**.nrChannelModel[*].correlationDistance = 10m
**.mobility.constraintAreaMaxZ = 50m
*.gnb.mobility.initialZ = 25m
*.ue[0].mobility.initialX = 550m
*.ue[0].mobility.initialY = 300m
*.ue[0].mobility.initialZ = 1.5m
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.speed = 25mps
*.ue[0].mobility.initialMovementHeading = 0deg
#------------------------------------#


#====================================#
# TR 38.901 (Tr38901ChannelModel, the NR NIC default)
#====================================#

#------------------------------------#
# Config InH-38901
#
# The TR 38.901 indoor-hotspot LOS probability and path loss.
#
[Config InH-38901]
extends = InHGeometry
#------------------------------------#

#------------------------------------#
# Config UMi-38901
#
# The TR 38.901 urban-microcell LOS probability and path loss.
#
[Config UMi-38901]
extends = UMiGeometry
#------------------------------------#

#------------------------------------#
# Config UMa-38901
#
# The TR 38.901 urban-macrocell LOS probability and path loss.
#
[Config UMa-38901]
extends = UMaGeometry
#------------------------------------#

#------------------------------------#
# Config RMa-38901
#
# The TR 38.901 rural-macrocell LOS probability and path loss, including the
# max(los, nlos) lower bound its NLOS branch applies per TR 38.901.
#
[Config RMa-38901]
extends = RMaGeometry
#------------------------------------#


#====================================#
# TR 36.873 (Tr36873ChannelModel)
#====================================#

#------------------------------------#
# Config InH-36873
#
# Tr36873PathLossModel has no indoor-hotspot case in its LOS probability, only
# in its path loss, so this configuration runs a mixed model: LOS is drawn from
# the TR 36.814 indoor formula of the base strategy and the path loss comes from
# the TR 36.873 indoor formula. At ground level (all coordinates z=0) the
# TR 36.873 indoor path loss reduces to the TR 36.814 one, so this row's
# fingerprint equals InH-36814's; the matching pair pins that identity.
#
[Config InH-36873]
extends = InHGeometry, Gen36873
#------------------------------------#

#------------------------------------#
# Config UMi-36873
#
# The TR 36.873 urban-microcell LOS probability and path loss.
#
[Config UMi-36873]
extends = UMiGeometry, Gen36873
#------------------------------------#

#------------------------------------#
# Config UMa-36873
#
# The TR 36.873 urban-macrocell LOS probability and path loss. The path loss
# draws the height environment per call, so this configuration also pins the
# RNG stream consumed inside the formula.
#
[Config UMa-36873]
extends = UMaGeometry, Gen36873
#------------------------------------#

#------------------------------------#
# Config RMa-36873
#
# The TR 36.873 rural-macrocell LOS probability and path loss.
#
[Config RMa-36873]
extends = RMaGeometry, Gen36873
#------------------------------------#

#------------------------------------#
# Config SMa-36873
#
# Tr36873PathLossModel implements neither the suburban-macrocell LOS probability
# nor its path loss; both delegate to the TR 36.814 formulas of its base strategy.
# This configuration pins that delegation.
#
[Config SMa-36873]
extends = SMaGeometry, Gen36873
#------------------------------------#


#====================================#
# TR 36.814 (StochasticChannelModel)
#====================================#

#------------------------------------#
# Config InH-36814
#
# The TR 36.814 indoor-hotspot LOS probability and path loss.
#
[Config InH-36814]
extends = InHGeometry, Gen36814
#------------------------------------#

#------------------------------------#
# Config UMi-36814
#
# The TR 36.814 urban-microcell LOS probability and path loss.
#
[Config UMi-36814]
extends = UMiGeometry, Gen36814
#------------------------------------#

#------------------------------------#
# Config UMa-36814
#
# The TR 36.814 urban-macrocell LOS probability and the LOS branch of its
# path loss; the NLOS branch is what every LTE example already runs.
#
[Config UMa-36814]
extends = UMaGeometry, Gen36814
#------------------------------------#

#------------------------------------#
# Config RMa-36814
#
# The TR 36.814 rural-macrocell LOS probability and path loss.
#
[Config RMa-36814]
extends = RMaGeometry, Gen36814
#------------------------------------#

#------------------------------------#
# Config SMa-36814
#
# The TR 36.814 suburban-macrocell LOS probability and path loss.
#
[Config SMa-36814]
extends = SMaGeometry, Gen36814
#------------------------------------#


#====================================#
# Special paths
#====================================#

#------------------------------------#
# Config FixedLos-38901
#
# dynamicLos=false with fixedLos=true: the LOS state is assigned, not drawn,
# and the LOS branch of the urban-macrocell path loss runs deterministically.
# Every example config takes the NLOS side of this assignment; this is the
# only coverage of the LOS side. Static UE at 50m.
#
[Config FixedLos-38901]
extends = Base

**.channelModel[*].scenario = "URBAN_MACROCELL"
**.nrChannelModel[*].scenario = "URBAN_MACROCELL"
**.channelModel[*].fixedLos = true
**.nrChannelModel[*].fixedLos = true

**.eNodeBTxPower = -30dBm
#------------------------------------#

#------------------------------------#
# Config Penetration-36873
#
# Building penetration loss of the TR 36.873 urban-macrocell path loss, in
# the sub-6GHz branch (constant 20dB through-wall loss plus the indoor
# distance term). The transmit power compensates the added loss.
#
[Config Penetration-36873]
extends = UMaGeometry, Gen36873

**.channelModel[*].insideBuilding = true
**.nrChannelModel[*].insideBuilding = true
**.eNodeBTxPower = 20dBm
#------------------------------------#

#------------------------------------#
# Config PenetrationLow-38901
#
# TR 38.901 building penetration loss, low-loss material model, at 28GHz
# where the frequency-dependent through-wall formulas apply (below 6GHz the
# loss is a constant 20dB).
#
[Config PenetrationLow-38901]
extends = InHGeometry

**.componentCarrier[0].carrierFrequency = 28GHz
**.channelModel[*].insideBuilding = true
**.nrChannelModel[*].insideBuilding = true
**.eNodeBTxPower = 15dBm
#------------------------------------#

#------------------------------------#
# Config PenetrationHigh-38901
#
# TR 38.901 building penetration loss, high-loss material model, at 28GHz.
#
[Config PenetrationHigh-38901]
extends = InHGeometry

**.componentCarrier[0].carrierFrequency = 28GHz
**.channelModel[*].insideBuilding = true
**.nrChannelModel[*].insideBuilding = true
**.channelModel[*].useBuildingPenetrationHighLossModel = true
**.nrChannelModel[*].useBuildingPenetrationHighLossModel = true
**.eNodeBTxPower = 40dBm
#------------------------------------#

#------------------------------------#
# Config Rayleigh-38901
#
# Rayleigh multipath fading instead of the default Jakes model.
#
[Config Rayleigh-38901]
extends = UMaGeometry

**.channelModel[*].fadingType = "RAYLEIGH"
**.nrChannelModel[*].fadingType = "RAYLEIGH"
#------------------------------------#

#------------------------------------#
# Config Anisotropic-36873
#
# Sectorial gNB antenna: the angular attenuation of TR 36.873 (horizontal
# and vertical pattern) enters the link budget. The UE moves away from the
# 45-degree boresight, so the horizontal pattern attenuation varies along the
# trajectory.
#
[Config Anisotropic-36873]
extends = UMaGeometry, Gen36873

*.gnb.cellularNic.radio.antenna.txDirection = "ANISOTROPIC"
*.gnb.cellularNic.radio.antenna.txAngle = 45deg
#------------------------------------#

#------------------------------------#
# Config SMa-38901
#
# TR 38.901 covers no suburban-macrocell scenario: path loss, LOS probability
# and the shadowing sigma all delegate through Tr36873PathLossModel down to the
# TR 36.814 formulas. This configuration pins the full delegation chain.
#
[Config SMa-38901]
extends = SMaGeometry
#------------------------------------#

#------------------------------------#
# Config TallUe-38901
#
# Rooftop-level UE (ueHeight >= 13m) in the TR 38.901 urban macrocell: the
# C(d2D, hUT) factor becomes nonzero, so the LOS probability gains its height
# term and the path loss draws the height environment from the 12m..hUT-1.5m
# vector, consuming extra RNG values per call.
#
[Config TallUe-38901]
extends = UMaGeometry

**.channelModel[*].ueHeight = 20m
**.nrChannelModel[*].ueHeight = 20m
*.ue[0].mobility.initialZ = 20m
#------------------------------------#

#------------------------------------#
# Config TallUe-36873
#
# Rooftop-level UE in the TR 36.873 urban macrocell: the same height-dependent
# branches as in TallUe-38901, in the TR 36.873 implementation.
#
[Config TallUe-36873]
extends = UMaGeometry, Gen36873

**.channelModel[*].ueHeight = 20m
**.nrChannelModel[*].ueHeight = 20m
*.ue[0].mobility.initialZ = 20m
#------------------------------------#
