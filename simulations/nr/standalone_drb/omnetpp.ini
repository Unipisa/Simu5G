[General]
sim-time-limit=20s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50 # this value should be kept equal to the number of RBs

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
[Config Standalone]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit=20s

############### e/gNodeB configuration #################
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

# 2 DRBs per UE * 2 UEs = 4 total DRB instances.
# DRB IDs are per-UE (as in 3GPP): each UE has DRB 1 and DRB 2. The drbId travels in
# FlowControlInfo, so both peers must use the same per-UE numbering -- which they do by
# construction, since the configuration is written once here and the bearer
# configurator tells the UE's RRC and the gNB's RRC alike what to set up. Each RRC
# then pushes on what its own layers consume: the QFI-to-DRB routing into SDAP, and
# the bearers' QoS profiles into the gNB MAC for the QoS-aware scheduler.
# QFI 1,2 -> DRB 1 (Voice/Video); QFI 3,4 -> DRB 2 (Gaming/URLLC)
# The two bearer kinds are named once as profiles saying what the bearer *is*; the
# entries add what *selects* it (its UE and its QFIs).
*.bearerConfigurator.drbProfiles = {
    voice:  {gbr: true, packetDelayBudget: 100, packetErrorRate: 1e-2, qosPriorityLevel: 2},
    gaming: {gbr: true, packetDelayBudget: 50,  packetErrorRate: 1e-3, qosPriorityLevel: 1}
    }
*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 1, mappedQfis: [1, 2], profile: "voice", isDefault: true},
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 2, mappedQfis: [3, 4], profile: "gaming"}
    ]
*.gnb.cellularNic.mac.schedulingDisciplineDl = "QOS_PF"
*.gnb.cellularNic.mac.schedulingDisciplineUl = "QOS_PF"

############## UE configuration ##################
*.numUe = 2

# connect the UE's NIC to the corresponding serving gNB (NR side only)
*.ue[*].cellularNic.nrPhy.dynamicCellAssociation = false
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1

# UE positions
*.ue[0].mobility.initialX = 350m
*.ue[0].mobility.initialY = 400m
*.ue[1].mobility.initialX = 550m
*.ue[1].mobility.initialY = 400m

#------------------------------------#
# Config VoIP-DL
#
# General configuration for Voice-over-IP DL traffic to the UE
#
[Config VoIP-DL]
extends=Standalone

# multiple UDP applications for each UE
*.ue[*].numApps = 4

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 8

#============= Application Setup =============
*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000
*.ue[*].app[1].localPort = 3001
*.ue[*].app[2].localPort = 3002
*.ue[*].app[3].localPort = 3003

*.server.app[*].packetSize = 40B
*.server.app[*].typename = "VoipSender"

*.server.app[0..3].destAddress = "ue[0]"
*.server.app[0].localPort = 3088+ancestorIndex(0)
*.server.app[1].localPort = 3089+ancestorIndex(0)
*.server.app[2].localPort = 3090+ancestorIndex(0)
*.server.app[3].localPort = 3091+ancestorIndex(0)

*.server.app[4..7].destAddress = "ue[1]"
*.server.app[4].localPort = 3092+ancestorIndex(0)
*.server.app[5].localPort = 3093+ancestorIndex(0)
*.server.app[6].localPort = 3094+ancestorIndex(0)
*.server.app[7].localPort = 3095+ancestorIndex(0)

*.server.app[0].destPort = 3000
*.server.app[1].destPort = 3001
*.server.app[2].destPort = 3002
*.server.app[3].destPort = 3003
*.server.app[4].destPort = 3000
*.server.app[5].destPort = 3001
*.server.app[6].destPort = 3002
*.server.app[7].destPort = 3003

*.server.app[0..3].startTime = uniform(0s,0.02s)
*.server.app[4..7].startTime = uniform(0.03s, 0.05s)

#------------------------------------#
# Config VoIP-DL-MultiQfi
#
# Same as VoIP-DL but each app uses a different QFI (and thus a different DRB).
# Apps 0..3 use QFI 1..4 respectively, same for both UEs.
#
[Config VoIP-DL-MultiQfi]
extends=VoIP-DL

# DSCP is extracted by TrafficFlowFilter as QFI, then carried in GTP-U to SDAP
*.server.app[0].dscp = 1    # QFI 1 (Voice)
*.server.app[1].dscp = 2    # QFI 2 (Video)
*.server.app[2].dscp = 3    # QFI 3 (Gaming)
*.server.app[3].dscp = 4    # QFI 4 (URLLC)
*.server.app[4].dscp = 1    # QFI 1 (Voice)
*.server.app[5].dscp = 2    # QFI 2 (Video)
*.server.app[6].dscp = 3    # QFI 3 (Gaming)
*.server.app[7].dscp = 4    # QFI 4 (URLLC)

#------------------------------------#
# Config VoIP-DL-MultiQfi-5qiProfiles
#
# Same as VoIP-DL-MultiQfi, but the bearers' QoS profiles are the standardized 5QI rows,
# referenced by name instead of hand-written field groups: 5QI 1 (conversational voice)
# for the Voice/Video DRB and 5QI 3 (real-time gaming) for the Gaming/URLLC one. The rows
# carry only what the spec standardizes; the RLC mode and the LCG derive from their
# characteristics (both PERs are above amPerThreshold -> RLC UM; priorities 20 and 30
# bucket to LCG 0 and 1). Note the spec ranks voice above gaming (priority 20 < 30), the
# reverse of the hand-written profiles (2 > 1) -- under load the two configurations
# schedule differently.
#
[Config VoIP-DL-MultiQfi-5qiProfiles]
extends = VoIP-DL-MultiQfi

*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 1, mappedQfis: [1, 2], profile: "5qi-1", isDefault: true},
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 2, mappedQfis: [3, 4], profile: "5qi-3"}
    ]

#------------------------------------#
# Config VoIP-DL-MultiQfi-NoOnDemand
#
# Same as VoIP-DL-MultiQfi, but with on-demand bearer establishment disabled:
# the static DRB configuration -- established up front at initialization, as
# always -- must cover every flow, and a packet that finds no bearer raises a
# configuration error instead of silently creating one.
#
[Config VoIP-DL-MultiQfi-NoOnDemand]
extends=VoIP-DL-MultiQfi

*.gnb.cellularNic.sdap.establishBearersOnDemand = false
*.ue[*].cellularNic.sdap.establishBearersOnDemand = false

#------------------------------------#
# Config VoIP-DL-MultiQfi-OnDemandDrb
#
# Same as VoIP-DL-MultiQfi, but the Gaming/URLLC DRB is not configured up front:
# QFIs 3 and 4 are served by an onDemandDrbs definition instead, so that DRB is
# created by the first Gaming or URLLC packet -- SDAP misses the QFI-to-DRB
# lookup and asks the bearer configurator -- and the other flow joins the same DRB. The
# Voice/Video DRB stays static and is the default.
#
[Config VoIP-DL-MultiQfi-OnDemandDrb]
extends=VoIP-DL-MultiQfi

*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 1, mappedQfis: [1, 2], profile: "voice", isDefault: true}
    ]
*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "5gc", ue: "ue[*]", mappedQfis: [3, 4], profile: "gaming"}
    ]

#------------------------------------#
# Config VoIP-DL-MultiQfi-Heavy
#
# Same as VoIP-DL-MultiQfi but with heavy traffic to create contention
# between nodes, useful for verifying proportional-fair scheduling behavior.
#
[Config VoIP-DL-MultiQfi-Heavy]
extends=VoIP-DL-MultiQfi

*.server.app[*].packetSize = 1000B
*.server.app[*].samplingTime = 0.001s
*.server.app[*].silences = false
*.server.app[*].startTime = 0s

#------------------------------------#
# Config VoIP-UL
#
# General configuration for Voice-over-IP UL traffic from the UE
#
[Config VoIP-UL]
extends=Standalone

# multiple UDP applications for each UE
*.ue[*].numApps = 4

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 8

#============= Application Setup =============
# Server: 8 VoipReceiver apps (4 per UE)
*.server.app[*].typename = "VoipReceiver"
*.server.app[0].localPort = 3000
*.server.app[1].localPort = 3001
*.server.app[2].localPort = 3002
*.server.app[3].localPort = 3003
*.server.app[4].localPort = 3004
*.server.app[5].localPort = 3005
*.server.app[6].localPort = 3006
*.server.app[7].localPort = 3007

# UE: 4 VoipSender apps each
*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].packetSize = 40B
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].startTime = uniform(0s,0.02s)

# ue[0] apps 0..3 → server apps 0..3 (ports 3000..3003)
*.ue[0].app[0].localPort = 3088
*.ue[0].app[1].localPort = 3089
*.ue[0].app[2].localPort = 3090
*.ue[0].app[3].localPort = 3091
*.ue[0].app[0].destPort = 3000
*.ue[0].app[1].destPort = 3001
*.ue[0].app[2].destPort = 3002
*.ue[0].app[3].destPort = 3003

# ue[1] apps 0..3 → server apps 4..7 (ports 3004..3007)
*.ue[1].app[0].localPort = 3092
*.ue[1].app[1].localPort = 3093
*.ue[1].app[2].localPort = 3094
*.ue[1].app[3].localPort = 3095
*.ue[1].app[0].destPort = 3004
*.ue[1].app[1].destPort = 3005
*.ue[1].app[2].destPort = 3006
*.ue[1].app[3].destPort = 3007

# Apps 0..3 stamp DSCP 1..4 on their packets, and the UE's QoS-flow classifier
# reads the DSCP as the QFI -- the uplink mirror of what the TrafficFlowFilter
# does for downlink traffic at the core network -- so the four flows use
# QFI 1..4 and spread across both DRBs of each UE.
*.ue[*].app[0].dscp = 1
*.ue[*].app[1].dscp = 2
*.ue[*].app[2].dscp = 3
*.ue[*].app[3].dscp = 4
*.bearerConfigurator.ulQfiRules = [{dscpAsQfi: true}]

#------------------------------------#
# Config VoIP-UL-FilterRules
#
# Same as VoIP-UL, but nothing marks the packets: the applications send with no DSCP,
# and the UEs' QoS-flow classifiers assign QFIs by destination port instead --
# classification that needs no cooperation from the applications, which is what the
# dscpAsQfi form cannot show. The rules are scoped per UE (the "ue" field), so each
# UE classifies against its own flows' ports.
#
[Config VoIP-UL-FilterRules]
extends = VoIP-UL

*.ue[*].app[*].dscp = -1

# ue[0]'s flows go to server ports 3000..3003, ue[1]'s to 3004..3007
*.bearerConfigurator.ulQfiRules = [
    {ue: "ue[0]", filter: "expr(udp.destPort == 3000)", qfi: 1},
    {ue: "ue[0]", filter: "expr(udp.destPort == 3001)", qfi: 2},
    {ue: "ue[0]", filter: "expr(udp.destPort == 3002)", qfi: 3},
    {ue: "ue[0]", filter: "expr(udp.destPort == 3003)", qfi: 4},
    {ue: "ue[1]", filter: "expr(udp.destPort == 3004)", qfi: 1},
    {ue: "ue[1]", filter: "expr(udp.destPort == 3005)", qfi: 2},
    {ue: "ue[1]", filter: "expr(udp.destPort == 3006)", qfi: 3},
    {ue: "ue[1]", filter: "expr(udp.destPort == 3007)", qfi: 4}]

#------------------------------------#
# Config VoIP-UL-CrossLcg
#
# Uplink flows of one UE spread across TWO logical channel groups: the bearers
# use the standardized 5QI rows, whose priorities (20 and 30) bucket to LCG 0
# and LCG 1. QFI 1 and 2 carry a continuous CBR load (~55% of the cell's served
# uplink capacity) on the higher-priority group; QFI 3 and 4 carry steady VoIP
# on the lower-priority one, with capacity to spare for it. This exercises what
# no other uplink scenario does: buffer status reporting and grant sizing for a
# UE whose backlog spans priority groups -- the lower group's flows are served
# only as well as the eNB's picture of the UE's total backlog allows.
#
[Config VoIP-UL-CrossLcg]
extends = VoIP-UL

*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 1, mappedQfis: [1, 2], profile: "5qi-1", isDefault: true},
    {coreNetwork: "5gc", ue: "ue[*]", drbId: 2, mappedQfis: [3, 4], profile: "5qi-3"}
    ]

# QFI 1,2: continuous CBR on the higher-priority group (DSCP 1,2 via the TOS field)
*.ue[*].app[0..1].typename = "CbrSender"
*.ue[*].app[0..1].packetSize = 1000B
*.ue[*].app[0..1].samplingTime = 0.013s
*.ue[*].app[0..1].startTime = uniform(0s, 0.02s)
*.ue[*].app[0].tos = 4
*.ue[*].app[1].tos = 8

# QFI 3,4: steady VoIP on the lower-priority group
*.ue[*].app[2..3].silences = false

*.server.app[0..1].typename = "CbrReceiver"
*.server.app[4..5].typename = "CbrReceiver"

#------------------------------------#
# Config VoIP-UL-CrossLcg-Heavy
#
# VoIP-UL-CrossLcg with BOTH logical channel groups continuously backlogged: the
# second CBR flow moves to the lower-priority group and both CBR rates rise, so
# each UE offers a heavy load on each of its two groups instead of a heavy one
# on the higher group and steady VoIP on the lower.
#
# This is the scenario that tells the two readings of "one grant per UE per TTI"
# apart. A grant is one transport block that the UE's own LCP divides among its
# channels, so it is sized from the UE's WHOLE reported backlog; sizing it from
# the one group whose pseudo-connection won the scheduling round instead leaves
# the UE's other groups waiting for a later TTI however much room the cell has.
# Where only one group is backlogged the two readings coincide, which is what
# makes every other uplink row blind to the difference. Here they diverge: the
# lower-priority flows go from starved to fully served.
#
# It is equally sensitive to how the grant is ACCOUNTED for. The block is drained
# from the scheduled group's mirror alone, because the eNB cannot know how the
# UE's LCP will divide it; draining the UE's mirrors in group order instead
# credits a group with bytes the UE may never have sent from it, and that group
# then goes unscheduled until its next report -- which costs more here than the
# undersized grant did.
#
[Config VoIP-UL-CrossLcg-Heavy]
extends = VoIP-UL-CrossLcg

# QFI 3 puts the second CBR flow on the lower-priority group (DSCP 3 via the TOS
# field), and the rate takes both groups past what one group's worth of grant
# can carry
*.ue[*].app[1].tos = 12
*.ue[*].app[0..1].samplingTime = 0.004s

#------------------------------------#
# Config VoIP-DL-NoDrbConfig
#
# A stack with SDAP running with no authored bearers at all. The same VoIP-DL
# traffic as the other configurations, but staticDrbs is emptied and onDemandDrbs
# left at its default value: the default carries a "5gc" catch-all default bearer
# for exactly this case, so the first packet materializes one default DRB per UE.
# The catch-all is header-suppressed, so the unmarked traffic (all of it QFI 0, the
# default QoS flow) crosses the air interface with no SDAP header; traffic showing
# up with several QFIs would stop with an error asking for authored bearers. This
# is the SDAP-stack counterpart of the unauthored SDAP-less run, where the
# onDemandDrbs default's "epc" catch-alls do the same job.
#
# (The scheduler is reset to its default because the QoS-aware one needs per-bearer
# QoS profiles, which an unauthored bearer has none of; with nothing authored there
# is nothing to schedule by, so plain scheduling is the honest choice.)
#
[Config VoIP-DL-NoDrbConfig]
extends = VoIP-DL

*.bearerConfigurator.staticDrbs = []
*.gnb.cellularNic.mac.schedulingDisciplineDl = default
*.gnb.cellularNic.mac.schedulingDisciplineUl = default
