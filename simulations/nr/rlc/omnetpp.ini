#
# RLC validation scenarios.
#
# These configurations exist to exercise and quantitatively validate the NR RLC
# (TS 38.322) implementation, not to be realistic deployments. They deliberately
# strip away everything that makes loss rates an emergent property of the
# scenario:
#
#  - the channel is ~IdealChannelModel~, which does not model propagation at
#    all: attenuation is zero, the reported SINR is a fixed large value (so the
#    CQI and hence the transport block size never vary), and whether a frame is
#    received is a coin flip at a configured error rate. With harqReduction = 1
#    the transmission attempts are independent, so a frame that exhausts its HARQ
#    retransmissions -- and is therefore lost as far as RLC is concerned -- has
#    probability perDl^(maxHarqRtx+1). That makes the residual loss rate RLC sees
#    an exact, configurable number.
#  - the error rate is set per direction. RLC AM needs its feedback path to
#    survive for ARQ to work at all, so these scenarios use a lossy downlink and
#    a clean uplink; that isolates the data path under test from the STATUS path.
#  - the traffic is CBR rather than VoIP, so the offered load is deterministic.
#  - the channel model draws its coin flips from a separate RNG, so that changing
#    the error rate does not shift the traffic source's random stream. Without
#    this, a lossy run and a clean run do not even offer the same SDUs, and the
#    two are not comparable.
#
# The expected outcomes are stated with each configuration; see the RLC section
# of the documentation for the reasoning behind them.
#

[General]
abstract = true
sim-time-limit = 20s
network = simu5g.simulations.nr.networks.SingleCell_Standalone
**.routingRecorder.enabled = false

############### Statistics ##################
# ${iterationvarsf} keeps the parameter-study runs apart; it is empty when a
# configuration has no iteration variables.
output-scalar-file = ${resultdir}/${configname}/${iterationvarsf}${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvarsf}${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

############### Mobility ##################
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Radio ##################
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm

############### IPv4 configurator ##################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config Base
#
# Single stationary UE served by one gNB, over the error-rate channel model, with
# the loss process on its own RNG so it is independent of the traffic.
#
[Config Base]
abstract = true

*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

*.numUe = 1
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m

# Replace propagation modelling with a configurable per-direction error rate.
*.gnb.cellularNic.channelModelType = "IdealChannelModel"
*.ue[*].cellularNic.nrChannelModelType = "IdealChannelModel"

# Independent HARQ attempts, so the residual loss rate is exactly perDl^(maxHarqRtx+1).
**.harqReduction = 1

# Clean uplink: RLC AM STATUS PDUs are never lost, so the downlink ARQ under test
# is not confounded by a lossy feedback path.
**.perUl = 0
**.perD2D = 0

# Keep the loss process off the traffic source's RNG, so that changing the error
# rate does not change which SDUs are offered.
num-rngs = 2
**.channelModel[*].rng-0 = 1
**.nrChannelModel[*].rng-0 = 1
*.radioMedium.rng-0 = 1

############## Deterministic CBR traffic, downlink ##############
*.ue[*].numApps = 1
*.server.numApps = 1

*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 3000

*.server.app[0].typename = "CbrSender"
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 3000
*.server.app[0].localPort = 3088
*.server.app[0].packetSize = 40B
*.server.app[0].samplingTime = 0.01s   # 100 SDU/s
*.server.app[0].startTime = 1s
# Stop well before the end of the run, so that whatever is in flight or awaiting
# retransmission when the source stops still has time to be delivered. Without this
# drain period an SDU that is merely still in flight at the time limit is
# indistinguishable from one that was lost.
*.server.app[0].finishTime = 18s
#------------------------------------#


#------------------------------------#
# Config AmBase
#
# As Base, but the packet-classified bearers are carried over RLC AM, so the CBR
# flow lands on an AM bearer whichever traffic class it is mapped to. NR bearers
# use the NR AM entities (NrRlcAmEntity) by default.
#
[Config AmBase]
abstract = true
extends = Base

*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 3, rlcMode: "AM"}]
#------------------------------------#


#------------------------------------#
# Config AM-Clean
#
# Error-free reference. Establishes the baseline the lossy runs are compared
# against, and checks that AM adds nothing when there is nothing to recover.
#
# Expected: no HARQ errors, every offered SDU delivered exactly once, and the TX
# window never more than a few SDUs deep.
#
# One retransmission is expected even here, at the very end of the run: when the
# source stops, t-PollRetransmit expires before the last SDU's acknowledgement
# arrives and that SDU is retransmitted (TS 38.322 5.3.3). The receiver discards
# the duplicate, so one more PDU is sent than the receiver delivers SDUs.
#
[Config AM-Clean]
extends = AmBase

**.perDl = 0
#------------------------------------#


#------------------------------------#
# Config AM-Lossy
#
# The main quantitative case: a downlink losing a known fraction of transmission
# attempts, swept over four error rates.
#
# With maxHarqRtx = 3 (four attempts) and independent attempts, the fraction of
# RLC PDUs that HARQ fails to deliver is perDl^4 -- 0.0001, 0.0081, 0.0625 and
# 0.2401 for the four points below. Those are the losses RLC AM has to repair.
#
# Expected: every offered SDU still delivered (this is the AM guarantee, and it
# is the assertion that matters most), the measured per-attempt HARQ error rate
# equal to perDl, and the RLC retransmission count rising with perDl^4.
#
# maxRtxThreshold is raised so that this configuration stays in the regime it is
# meant to measure. At the top of the sweep the residual loss is 24%, so an SDU
# failing maxRtxThreshold times in a row is not a rare event -- with the default
# threshold of 4 the link legitimately fails partway through the run, the bearer
# is torn down, and there is no ARQ behaviour left to measure. Radio link failure
# is exercised deliberately in AM-RLF instead.
#
[Config AM-Lossy]
extends = AmBase

**.perDl = ${perDl = 0.1, 0.3, 0.5, 0.7}
**.maxRtxThreshold = 32
#------------------------------------#


#------------------------------------#
# Config AM-Segmentation
#
# Exercises SO segmentation and, on retransmission, re-segmentation: the least
# covered path in the AM implementation. The SDUs are much larger than the grants
# the scheduler hands out, so each SDU is carried by several segments, and a lost
# segment is retransmitted -- possibly re-carved to a different grant size.
#
# Expected: as AM-Lossy, every SDU delivered and reassembled intact, with the
# retransmissions being segments rather than whole SDUs.
#
[Config AM-Segmentation]
extends = AmBase

*.server.app[0].packetSize = 1400B
*.server.app[0].samplingTime = 0.02s
**.perDl = 0.4
#------------------------------------#


#------------------------------------#
# Config AM-WindowStall
#
# Drives the transmitter into its window limit without failing the link: the
# window is small and the downlink lossy, so unacknowledged SDUs accumulate until
# no new SN can be assigned. maxRtxThreshold is raised so that the stall resolves
# rather than escalating to a radio link failure.
#
# Expected: txWindowFull events recorded and txWindowOccupation reaching the
# window size, but the flow recovering and all SDUs eventually delivered.
#
[Config AM-WindowStall]
extends = AmBase

# A small window, a loaded downlink and a high loss rate, so that unacknowledged
# SDUs pile up faster than the ARQ retires them. The load is deliberately kept
# below what the lossy link can carry: pushed harder the run simply ends with a
# large backlog, and whether the window recovers can no longer be seen.
**.AM_Window_Size = 64
**.maxRtxThreshold = 32
**.perDl = 0.5
*.server.app[0].samplingTime = 0.005s   # 200 SDU/s
*.server.app[0].finishTime = 15s        # longer drain: the backlog takes a while to clear
#------------------------------------#


#------------------------------------#
# Config AM-RLF
#
# Radio link failure. The downlink is clean until t = 5s and then fails
# completely, which is what the volatile perDl expression below expresses.
#
# The transmitter does not fail the link merely because the downlink went silent:
# on each t-PollRetransmit expiry it reconsiders the highest SN it has
# transmitted (TS 38.322 5.3.3), and while fresh SDUs keep arriving that is a new
# SN every time, whose RETX_COUNT starts at zero. Only once the window stalls
# does the same SN come up repeatedly, RETX_COUNT climb to maxRtxThreshold, and
# the failure get declared (TS 38.322 5.3.2). The window is kept small here so
# that this happens a second or two after the blackout instead of a minute later.
#
# BearerManagement then releases the link at both ends, deleting the bearer's
# MAC, RLC and PDCP state, and Ip2Nic drops further traffic for the released peer.
# With t311 = 0s (the default) there is no re-establishment: the UE goes to idle.
#
# Expected: exactly one radio link failure shortly after the window stalls, a
# clean teardown at both ends, and the downlink flow stopping for good.
#
[Config AM-RLF]
extends = AmBase

**.AM_Window_Size = 128
**.maxRtxThreshold = 4
**.perDl = simTime() < 5s ? 0 : 1
#------------------------------------#


#------------------------------------#
# Config AM-RLF-Reestablish
#
# As AM-RLF, but RRC re-establishment is enabled (TS 38.331 5.3.7), and the
# downlink comes back at t = 12s. On the failure the UE starts t311 to select a
# cell; the re-establishment request then runs t301, on whose expiry the peer is
# un-released and its bearer re-establishes on demand.
#
# Expected: a radio link failure as in AM-RLF, followed by the flow resuming once
# the link is back and the bearer has been re-established.
#
[Config AM-RLF-Reestablish]
extends = AM-RLF

**.perDl = (simTime() < 5s || simTime() >= 12s) ? 0 : 1
**.bearerManagement.t311 = 1s
**.bearerManagement.t301 = 0.1s
#------------------------------------#


#------------------------------------#
# Config UM-Lossy
#
# The contrast case, and a check that the loss injector does what it is believed
# to do: the same lossy downlink carried over RLC UM instead of AM. UM has no
# ARQ, so the losses are not repaired.
#
# Expected: no retransmissions at all, and an SDU loss rate at the application
# matching the residual perDl^(maxHarqRtx+1) that AM-Lossy repairs.
#
[Config UM-Lossy]
extends = Base

*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 3, rlcMode: "UM"}]

**.perDl = ${perDl = 0.1, 0.3, 0.5, 0.7}
#------------------------------------#


#------------------------------------#
# Config AM-Lossy-UL
#
# The uplink mirror of AM-Lossy: the UE transmits the CBR flow, so the UE-side
# AM entity carries data against the UE MAC's strict grant accounting, while
# the STATUS reports flow on a clean downlink.
#
# Expected: as AM-Lossy -- every offered SDU delivered.
#
[Config AM-Lossy-UL]
extends = AmBase

# reverse the traffic direction
*.ue[*].app[0].typename = "CbrSender"
*.ue[*].app[0].destAddress = "server"
*.ue[*].app[0].destPort = 3000
*.ue[*].app[0].localPort = 3088
*.ue[*].app[0].packetSize = 40B
*.ue[*].app[0].samplingTime = 0.01s
*.ue[*].app[0].startTime = 1s
*.ue[*].app[0].finishTime = 18s
*.server.app[0].typename = "CbrReceiver"
*.server.app[0].localPort = 3000

# lossy uplink data path, clean downlink for the STATUS reports
**.perUl = ${perUl = 0.5}
**.perDl = 0
**.maxRtxThreshold = 32
#------------------------------------#
