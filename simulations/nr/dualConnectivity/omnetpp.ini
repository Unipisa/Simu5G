[General]
abstract = true
sim-time-limit=20s
seed-set = ${repetition}

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec

**.vector-recording = false
**.sctp.**.scalar-recording = false  # remove annoying statistics from SCTP
**.sctp.**.vector-recording = false  # remove annoying statistics from SCTP
**.routingRecorder.enabled = false

############ Floorplan definition #################
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm

**.targetBler = 0.01
**.blerShift = 5

############### SCTP configuration ##################
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config DualConnectivity
#
# General topology configuration for the exemplary scenario for Dual Connectivity
# Use "runnable" configurations for testing (see below)
#
[Config DualConnectivity]
network = simu5g.simulations.nr.networks.SingleCell_withSecondaryGnb
sim-time-limit=20s
description = "Base configuration, do not run this config!"
abstract = true

############### e/gNodeB configuration #################
*.masterEnb.mobility.initialX = 300m
*.masterEnb.mobility.initialY = 300m
*.secondaryGnb.mobility.initialX = 600m
*.secondaryGnb.mobility.initialY = 300m

# the LTE eNodeB must use NR PDCP entities to exploit Dual Connectivity
*.masterEnb.cellularNic.ip2nic.isNr = true
*.masterEnb.cellularNic.rrc.bearerManagement.pdcpEntityModuleType = "simu5g.stack.pdcp.NrPdcpEntity"
*.secondaryGnb.masterId = 1
**.dualConnectivityEnabled = true

############### X2 configuration #################
*.*nb.numX2Apps = 1    # one x2App per peering node
*.*nb.x2App[*].server.localPort = 5000 + ancestorIndex(1) # Server ports (x2App[0]=5000, x2App[1]=5001, ...)
*.masterEnb.x2App[0].client.connectAddress = "secondaryGnb%x2ppp0"
*.secondaryGnb.x2App[0].client.connectAddress = "masterEnb%x2ppp0"

############## UE configuration ##################
*.numUe = 1

# connect the UE's NIC to the corresponding serving eNB
*.ue[0].servingNodeId = 1
*.ue[0].nrServingNodeId = 2

# UE position
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m
#------------------------------------#





#------------------------------------#
# Config VoIP-DL
#
# General configuration for Voice-over-IP DL traffic to the UE
# Use "runnable" configurations for testing (see below)
#
[Config DualConnectivity-VoIP-DL]
extends = DualConnectivity
description = "Base configuration, do not run this config!"
abstract = true

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[*].localPort = 3000+ancestorIndex(0)

*.server.app[*].typename = "VoipSender"
*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]" # obtain the address of the client by reading its index in the array of udp Apps
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].destPort = 3000+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#------------------------------------#
# Config VoIP-UL
#
# General configuration for Voice-over-IP UL traffic from the UE
# Use "runnable" configurations for testing (see below)
#
[Config DualConnectivity-VoIP-UL]
extends = DualConnectivity
description = "Base configuration, do not run this config!"
abstract = true

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 1000+ancestorIndex(0)

*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].destPort = 1000+ancestorIndex(0)
*.ue[*].app[*].startTime = uniform(0s,0.02s)
#------------------------------------#





###########################
# Runnable configurations #
###########################

# A bearer's type -- which cell groups serve it -- is its "legs" (see the "Bearer types
# stated by their configuration" section below and the ~BearerConfigurator documentation):
# an MCG bearer rides the master, an SCG bearer the secondary, a split bearer both. A split
# bearer shares its PDUs between the legs by the standardized primaryPath/ulDataSplitThreshold
# policy (uplink stays on the primary path until the pending data reaches the threshold), or
# a per-direction leg-selection expression (ulLegSelection/dlLegSelection) for tests. A flow
# reaches the bearer whose filters or QFIs select it; several flows of one UE can therefore
# ride bearers of different types.

#------------------------------------#
# The UE's default bearer stays on the master: with no split configuration the bearer keeps
# to its primary path (the master cell group), never engaging the secondary.
[Config DualConn-MasterOnly-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, master only, Voice-over-IP (downlink)"
*.server.app[*].tos = -1
#------------------------------------#

#------------------------------------#
[Config DualConn-MasterOnly-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, master only, Voice-over-IP (uplink)"
*.ue[*].app[*].tos = -1
#------------------------------------#

#------------------------------------#
# A split bearer pinned to the secondary: primaryPath SCG with the split threshold left at
# infinity, so it never engages the master leg. All of this UE's data rides the gNodeB.
[Config DualConn-SecondaryOnly-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, secondary only, Voice-over-IP (downlink)"
*.server.app[*].tos = 10
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], primaryPath: "SCG"}]
#------------------------------------#

#------------------------------------#
[Config DualConn-SecondaryOnly-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, secondary only, Voice-over-IP (uplink)"
*.ue[*].app[*].tos = 10
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], primaryPath: "SCG"}]
#------------------------------------#



#------------------------------------#
# One UE with TWO flows on separate bearers: the marked flow (selected by its marking) rides
# a split bearer pinned to the secondary gNodeB, the default flow its split bearer on the
# master eNodeB. The ToS marking now selects the bearer, not the leg within one bearer.
#
[Config DualConn-MasterPlusSecondary-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, master and secondary, Voice-over-IP (downlink)"

# One bearer per ToS value: the marked flow rides a split bearer pinned to the secondary
# (primaryPath SCG, never split), the default flow its split bearer on the master
*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "epc", filters: ["expr(ipv4.typeOfService == 10)"], lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], primaryPath: "SCG"},
    {coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM"}
    ]
# one UDP application for each user
*.ue[*].numApps = 2
# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 2
*.server.app[0].tos = -1
*.server.app[1].tos = 10
#------------------------------------#



#------------------------------------#
# One UE with TWO UL flows, each on a bearer of a different type (see the DL version above).
#
[Config DualConn-MasterPlusSecondary-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, master and secondary, Voice-over-IP (uplink)"

# One bearer per ToS value: the marked flow rides a split bearer pinned to the secondary
# (primaryPath SCG, never split), the default flow its split bearer on the master
*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "epc", filters: ["expr(ipv4.typeOfService == 10)"], lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], primaryPath: "SCG"},
    {coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM"}
    ]
# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 2
# one UDP application for each user
*.ue[*].numApps = 2
*.ue[*].app[0].tos = -1
*.ue[*].app[1].tos = 10
#------------------------------------#

#------------------------------------#
# A split bearer whose leg-selection expression alternates its PDUs between the two legs (a
# Simu5G test knob, not a 3GPP mechanism -- see DualConn-SplitBearer-Configured-DL below).
[Config DualConn-SplitBearer-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, split bearer, Voice-over-IP (downlink)"
*.server.app[*].tos = 20
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], dlLegSelection: "expr(packetOrdinal % 2)"}]
#------------------------------------#

#------------------------------------#
[Config DualConn-SplitBearer-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, split bearer, Voice-over-IP (uplink)"
*.ue[*].app[*].tos = 20
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], ulDataSplitThreshold: 0, ulLegSelection: "expr(packetOrdinal % 2)"}]
#------------------------------------#

#------------------------------------#
# A split bearer under the standardized buffer-occupancy policy: the UE keeps its PDUs on
# the primary path (the master) until its pending data reaches the split threshold, then
# spreads them to the least-loaded leg. With the threshold at zero the UE weighs both legs
# for every PDU, engaging the secondary whenever the master leg is the busier one. The
# radio is deliberately narrow (few bands) and several flows share the bearer, so the
# master leg saturates and part of the load is offloaded to the secondary.
[Config DualConn-SplitBearer-Threshold-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, split bearer steered by buffer occupancy (uplink)"
**.numBands = 2
*.ue[*].numApps = 6
*.server.numApps = 6
*.ue[*].app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"], primaryPath: "MCG", ulDataSplitThreshold: 0}]
#------------------------------------#

###############################################
# Bearer types stated by their configuration  #
###############################################

# Which cell groups serve a bearer is its "legs": a definition decides whether it is an MCG
# bearer, an SCG bearer or a split bearer (TS 37.340). Traffic is unmarked throughout, and
# every flow lands on the one bearer the definition describes.

#------------------------------------#
# The bearer is served by the master cell group only: the secondary gNB carries none of
# this UE's data.
#
[Config DualConn-McgBearer-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, MCG bearer stated by its configuration (downlink)"
*.server.app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["MCG"]}]
#------------------------------------#

#------------------------------------#
# The bearer is served by both cell groups, and its definition sets a dlLegSelection
# expression that alternates PDUs between the legs. Downlink split flow control is not
# standardized (the master cannot weigh the secondary's queue across X2), so this expression
# is how the downlink split is directed here.
#
[Config DualConn-SplitBearer-Configured-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, split bearer with a dlLegSelection expression (downlink)"
*.server.app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["MCG", "SCG"],
                       dlLegSelection: "expr(packetOrdinal % 2)"}]
#------------------------------------#

#------------------------------------#
# The bearer is served by the secondary cell group only: an SCG bearer. Its PDCP still
# terminates at the master eNodeB -- the core network delivers the UE's traffic there --
# but every PDU crosses to the secondary gNB over X2: no cell group of the master's own
# carries this UE's data, which the per-packet policy cannot express (its bearer always
# has a master leg).
#
[Config DualConn-ScgBearer-DL]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, SCG bearer stated by its configuration (downlink)"
*.server.app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["SCG"]}]
#------------------------------------#

#------------------------------------#
[Config DualConn-ScgBearer-UL]
extends=DualConnectivity-VoIP-UL
description = "dual connectivity, SCG bearer stated by its configuration (uplink)"
*.ue[*].app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["SCG"]}]
#------------------------------------#

#------------------------------------#
# A split bearer whose reordering window repeatedly fills to its full size, to exercise the
# NR PDCP reorder buffer at its boundary (see ~NrPdcpRxEntity). Every eighth PDU is routed
# to the secondary leg, which reaches the UE over a deliberately slow X2, so it always lands
# after the master leg's following PDUs: the receiver holds a hole at the missing secondary
# SN while later master SNs fill the window, until the reordering timer flushes it. With a
# window of four this happens every cycle, driving the flush that shifts the window by its
# whole size -- the case a per-cycle reorder never reaches. Its delivery count is the
# regression check: an entity that mishandles a fully drained window loses the SDUs that
# follow it.
[Config DualConn-ReorderWindowStall]
extends=DualConnectivity-VoIP-DL
description = "dual connectivity, split bearer whose reorder window fills to capacity"
sim-time-limit = 20s
*.server.app[*].tos = -1
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "epc", isDefault: true, rlcMode: "UM", legs: ["MCG", "SCG"], dlLegSelection: "expr(packetOrdinal % 8 == 0 ? 1 : 0)"}]
**.rxWindowSize = 4
*.masterEnb.x2$o[0].channel.delay = 0.2s
*.secondaryGnb.x2$o[0].channel.delay = 0.2s
#------------------------------------#


#######################################################
# NE-DC: an NR master with an LTE secondary           #
#######################################################

# The mirror image of the configurations above: the gNodeB is the master node and the
# eNodeB is its secondary, so the UE is anchored on its NR stack and its LTE stack carries
# the secondary cell group. Data-plane traffic enters at the gNodeB.
#
# Unlike EN-DC, the core network is a 5GC (Upf) -- NE-DC's shape in TS 37.340 -- so these
# are "5gc" bearers selected by QFI, and SDAP is in the dual-connectivity stack: SDAP
# terminates with PDCP at the master gNodeB and at the UE, while the secondary eNodeB
# (which has no SDAP, and no core-network link of its own) carries a plain RLC/MAC leg
# fed over X2. Plain VoIP rides the built-in header-suppressed default bearer; see the
# MultiQfi configurations for SDAP headers crossing both legs.
#
# All bearer shapes work: the anchor (MCG) leg is the gNodeB's radio, and a split bearer's
# secondary leg reaches the eNodeB -- the splitter reads the anchor's technology off the
# flow's ids, so leg 1 translates to the UE's LTE stack here, where under EN-DC it is the
# NR one.

#------------------------------------#
[Config NeDualConnectivity]
network = simu5g.simulations.nr.networks.SingleCell_withSecondaryEnb
sim-time-limit = 20s
description = "Base configuration, do not run this config!"
abstract = true

############### e/gNodeB configuration #################
*.masterGnb.mobility.initialX = 300m
*.masterGnb.mobility.initialY = 300m
*.secondaryEnb.mobility.initialX = 600m
*.secondaryEnb.mobility.initialY = 300m

*.secondaryEnb.masterId = 1
**.dualConnectivityEnabled = true

# the secondary eNodeB has no core-network link (its bearers' PDCP terminates at the
# master); its GTP module still resolves the gateway name at setup, so point it at
# the network's Upf instead of its default "pgw"
*.secondaryEnb.gateway = "upf"

############### X2 configuration #################
*.*nb.numX2Apps = 1    # one x2App per peering node
*.*nb.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.masterGnb.x2App[0].client.connectAddress = "secondaryEnb%x2ppp0"
*.secondaryEnb.x2App[0].client.connectAddress = "masterGnb%x2ppp0"

############## UE configuration ##################
*.numUe = 1

# the UE's NR stack faces the master gNodeB, its LTE stack the secondary eNodeB
*.ue[0].nrServingNodeId = 1
*.ue[0].servingNodeId = 2

*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m
#------------------------------------#

#------------------------------------#
[Config NeDualConn-VoIP-DL]
extends = NeDualConnectivity
description = "NE-DC, Voice-over-IP (downlink)"

*.ue[*].numApps = 1
*.server.numApps = 1

*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[*].localPort = 3000+ancestorIndex(0)

*.server.app[*].typename = "VoipSender"
*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]"
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].destPort = 3000+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
*.server.app[*].tos = -1
#------------------------------------#

#------------------------------------#
[Config NeDualConn-VoIP-UL]
extends = NeDualConnectivity
description = "NE-DC, Voice-over-IP (uplink)"

*.ue[*].numApps = 1
*.server.numApps = 1

*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 3000+ancestorIndex(0)

*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].packetSize = 40B
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].destPort = 3000+ancestorIndex(0)
*.ue[*].app[*].startTime = uniform(0s,0.02s)
*.ue[*].app[*].tos = -1
#------------------------------------#

#------------------------------------#
# The bearer is served by both cell groups, stated by its configuration; PDUs alternate
# between the gNodeB's radio (anchor leg) and the eNodeB's (secondary leg, via X2).
#
[Config NeDualConn-SplitBearer-Configured-DL]
extends = NeDualConn-VoIP-DL
description = "NE-DC, split bearer stated by its configuration (downlink)"
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true,
                       lcg: 3, rlcMode: "UM", legs: ["MCG", "SCG"],
                       dlLegSelection: "expr(packetOrdinal % 2)"}]
#------------------------------------#

#------------------------------------#
# Two DSCP-marked flows become QFI 1 and 2 (the Upf's DSCP-as-QFI default rules for
# downlink), both mapped onto ONE split DRB: two QoS flows on one bearer means SDAP
# headers on the wire, so this is the configuration where SDAP headers cross both legs
# of a dual-connectivity bearer -- and X2, for the secondary's leg. Unmarked traffic
# falls to the header-suppressed default bearer.
#
[Config NeDualConn-MultiQfi-DL]
extends = NeDualConn-VoIP-DL
description = "NE-DC, two QoS flows with SDAP headers on one split bearer (downlink)"

*.ue[*].numApps = 2
*.server.numApps = 2
*.server.app[0].dscp = 1
*.server.app[1].dscp = 2

*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "5gc", mappedQfis: [1, 2], lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"],
     dlLegSelection: "expr(packetOrdinal % 2)"},
    {coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 3, rlcMode: "UM"}]
#------------------------------------#

#------------------------------------#
# The uplink mirror: the UE's QoS-flow classifier reads the DSCP as the QFI (the
# delivered ulQfiRules), and the split bearer sends every second PDU on the secondary
# leg -- threshold 0 puts every uplink PDU under ulLegSelection -- so uplink SDAP
# headers cross both legs and ride X2 toward the master.
#
[Config NeDualConn-MultiQfi-UL]
extends = NeDualConn-VoIP-UL
description = "NE-DC, two QoS flows with SDAP headers on one split bearer (uplink)"

*.ue[*].numApps = 2
*.server.numApps = 2
*.ue[*].app[0].dscp = 1
*.ue[*].app[1].dscp = 2

*.bearerConfigurator.ulQfiRules = [{dscpAsQfi: true}]
*.bearerConfigurator.onDemandDrbs = [
    {coreNetwork: "5gc", mappedQfis: [1, 2], lcg: 0, rlcMode: "UM", legs: ["MCG", "SCG"],
     ulDataSplitThreshold: 0, ulLegSelection: "expr(packetOrdinal % 2)"},
    {coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 3, rlcMode: "UM"}]
#------------------------------------#


#------------------------------------#
# Config NeIpv6
#
# IPv6 PDU sessions on the NE-DC network: the UE and the data network run IPv6
# only, end to end; the transport network (the N3/N9 tunnels and X2) stays IPv4.
# The UPF is the router on the session's IP link and answers the UE's Neighbor
# Discovery.
#
[Config NeIpv6]
abstract = true
*.ipv6Configurator.typename = "Ipv6NetworkConfigurator"
*.ipv6Configurator.config = xml("<config><interface hosts='**' prefix='2001:db8:0:x::/64'/></config>")
**.ipv6.configurator.networkConfiguratorModule = "ipv6Configurator"
*.ue[*].hasIpv4 = false
*.ue[*].hasIpv6 = true
*.server.hasIpv4 = false
*.server.hasIpv6 = true
*.router.hasIpv4 = false
*.router.hasIpv6 = true
*.upf.hasNdResponder = true
*.ue[*].sessionType = "IPv6"
#------------------------------------#


#------------------------------------#
# Config NeDualConn-VoIP-DL-IPv6
#
# NeDualConn-VoIP-DL over an IPv6 PDU session
#
[Config NeDualConn-VoIP-DL-IPv6]
extends = NeDualConn-VoIP-DL, NeIpv6
#------------------------------------#
