[General]
abstract = true
sim-time-limit = 5s
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5


#------------------------------------#
# Config UnstructuredBase
#
# What the configs below share: the UEs of Unstructured sessions (TS 23.501 5.6.10.3)
# and the N6 end of the sessions at the UPF. An application attached to a UE's cellular
# NIC sends opaque payload, which the UPF (the session's anchor) carries to the
# application server over the session's N6 point-to-point tunnel, in UDP/IP datagrams
# from the session's N6 address (TS 29.561 9.2). The server, a stock UdpEchoApp,
# echoes each datagram back to that address; the UPF strips the UDP/IP headers and
# tunnels the payload down to the UE. The UEs have no IP layer.
#
[Config UnstructuredBase]
abstract = true

# the UEs: an Unstructured session, and an application attached to the NIC directly
*.ue[*].sessionType = "Unstructured"
*.ue[*].hasIpv4 = false
*.ue[*].numUnstructuredApps = 1
*.ue[*].unstructuredApp[0].source.packetLength = 100B
*.ue[*].unstructuredApp[0].source.productionInterval = 20ms
*.ue[*].unstructuredApp[0].source.initialProductionOffset = 0.1s

# the server, which echoes the payload
*.server.numApps = 1
*.server.app[0].typename = "UdpEchoApp"
*.server.app[0].localPort = 5000

# the N6 end of the Unstructured sessions at the UPF
*.upf.nodeControl.unstructuredServer = "server"
*.upf.nodeControl.unstructuredServerPort = 5000
*.upf.nodeControl.unstructuredPort = 5001
#------------------------------------#


#------------------------------------#
# Config Ipv6N6
#
# The data network runs IPv6, the variant TS 29.561 describes: the sessions' N6
# addresses come from the UPF's IPv6 prefix, which the router routes to the UPF
#
[Config Ipv6N6]
abstract = true
*.configurator.config = xmldoc("../standalone/demo.xml")
*.ipv6Configurator.typename = "Ipv6NetworkConfigurator"
*.ipv6Configurator.config = xml("<config><interface hosts='server router' prefix='2001:db8:0:x::/64'/><route hosts='router' destination='2001:db8:5::/64' interface='ppp1'/></config>")
**.ipv6.configurator.networkConfiguratorModule = "ipv6Configurator"
*.server.hasIpv4 = false
*.server.hasIpv6 = true
*.router.hasIpv6 = true
*.upf.nodeControl.unstructuredPrefix = "2001:db8:5::/64"
#------------------------------------#


#------------------------------------#
# Config Ipv4N6
#
# The data network runs IPv4: the sessions' N6 addresses come from the UPF's IPv4
# prefix, which the router routes to the UPF
#
[Config Ipv4N6]
abstract = true
*.configurator.config = xml("<config> \
    <interface among='gnb* upf* iUpf*' address='10.x.x.x' netmask='255.255.255.0'/> \
    <interface hosts='*' address='192.168.x.x' netmask='255.255.255.0'/> \
    <route hosts='router' destination='10.99.0.0' netmask='255.255.0.0' interface='ppp1'/> \
    </config>")
*.upf.nodeControl.unstructuredPrefix = "10.99.0.0/16"
#------------------------------------#


#------------------------------------#
# Config SingleCell
#
# One gNB, one UE
#
[Config SingleCell]
abstract = true
network = simu5g.simulations.nr.networks.SingleCell_Standalone
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m
*.numUe = 1
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].mobility.initialX = 450m
*.ue[*].mobility.initialY = 350m
#------------------------------------#


#------------------------------------#
# Config Unstructured
#
# An Unstructured session's uplink and downlink, through an echo server, over an
# IPv6 data network
#
[Config Unstructured]
extends = UnstructuredBase, Ipv6N6, SingleCell
#------------------------------------#


#------------------------------------#
# Config Unstructured-Ipv4N6
#
# Config Unstructured, over an IPv4 data network
#
[Config Unstructured-Ipv4N6]
extends = UnstructuredBase, Ipv4N6, SingleCell
#------------------------------------#


#------------------------------------#
# Config Unstructured-Handover
#
# Config Unstructured, while the UE moves from one gNB to the other: the downlink
# the source gNB holds when the UE leaves is forwarded to the target over X2 on the
# session's forwarding tunnel, which names the session, and so what the forwarded
# packets carry. The session keeps its anchor and N6 address (SSC mode 1).
#
[Config Unstructured-Handover]
extends = UnstructuredBase, Ipv6N6
network = simu5g.simulations.nr.networks.MultiCell_Standalone
*.gnb1.mobility.initialX = 250m
*.gnb1.mobility.initialY = 500m
*.gnb2.mobility.initialX = 750m
*.gnb2.mobility.initialY = 500m
*.gnb*.numX2Apps = 1
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"
**.sctp.nagleEnabled = false         # if true, transmission of small packets will be delayed on the X2
**.sctp.enableHeartbeats = false
*.numUe = 1
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
**.dynamicCellAssociation = true
**.enableHandover = true
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.initialX = 420m
*.ue[*].mobility.initialY = 500m
*.ue[*].mobility.initialMovementHeading = 0deg
*.ue[*].mobility.speed = 30mps
#------------------------------------#


#------------------------------------#
# Config Unstructured-Mixed
#
# One UPF anchors both kinds of session: ue[0] has an Unstructured session, whose
# payload the UPF carries to the echo server over its N6 tunnel, and ue[1] an IPv4
# one, on which the UE sends voice to the same server, which is also an IPv4 host
#
[Config Unstructured-Mixed]
extends = UnstructuredBase, Ipv4N6, SingleCell
*.numUe = 2
*.ue[1].sessionType = "IPv4"
*.ue[1].hasIpv4 = true
*.ue[1].numUnstructuredApps = 0
*.ue[1].mobility.initialX = 480m
*.ue[1].numApps = 1
*.ue[1].app[0].typename = "VoipSender"
*.ue[1].app[0].destAddress = "server"
*.ue[1].app[0].destPort = 3000
*.ue[1].app[0].localPort = 3088
*.server.numApps = 2
*.server.app[1].typename = "VoipReceiver"
*.server.app[1].localPort = 3000
#------------------------------------#
