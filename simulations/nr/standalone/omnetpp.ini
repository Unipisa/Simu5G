[General]
abstract = true
sim-time-limit=20s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50 # this value should be kept equal to the number of RBs

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
[Config Standalone]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit=20s

############### e/gNodeB configuration #################
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

############## UE configuration ##################
*.numUe = 1

# connect the UE's NIC to the corresponding serving gNB (NR side only)
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1

# UE position
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m
#------------------------------------#



#------------------------------------#
# Config VoIP-DL
#
# General configuration for Voice-over-IP DL traffic to the UE
#
[Config VoIP-DL]
extends=Standalone

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000

*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]" # obtain the address of the client by reading its index in the array of udp Apps
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].typename = "VoipSender"
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#



#------------------------------------#
# Config VoIP-UL
#
# General configuration for Voice-over-IP UL traffic from the UE
#
[Config VoIP-UL]
extends=Standalone

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 3000+ancestorIndex(0)

*.ue[*].app[*].packetSize = 40B
# obtain the address of the client by reading its index in the array of udp Apps
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#------------------------------------#
# Config VoIP-DL-AM
#
# Voice-over-IP DL traffic using RLC Acknowledged Mode (AM)
#
[Config VoIP-DL-AM]
extends=VoIP-DL

# The VoIP bearer runs RLC AM; a single QoS flow rides the default bearer, so it
# goes without an SDAP header
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 0, rlcMode: "AM"}]

# Use the NR RLC-AM entities for the AM data radio bearer (RLC mux architecture)
# (the NR RLC-AM entities are the default for NR bearers; no explicit selection needed)
#------------------------------------#



#------------------------------------#
# Config VoIP-DL-AM-Lossy
#
# Same as VoIP-DL-AM but with poor channel conditions to trigger HARQ failures
# and exercise the RLC-AM ARQ retransmission mechanism.
#
[Config VoIP-DL-AM-Lossy]
extends=VoIP-DL-AM

# Place the UE far from the gNB and enlarge the constraint area, so the DL SINR
# is marginal and a few PDUs leak past HARQ, creating RLC-AM gaps.
**.mobility.constraintAreaMaxX = 5000m
**.mobility.constraintAreaMaxY = 5000m
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 4000m

# Match UE TX power to gNB so UL works at the same distance (STATUS PDUs get through).
**.ueTxPower = 40dBm

# Allow a single HARQ retransmission (same on both ends) and raise target BLER so
# the scheduler picks a less robust MCS -> occasional DL losses -> NACK/retx cycles.
**.maxHarqRtx = 1
**.targetBler = 0.3
#------------------------------------#



#------------------------------------#
# Config VoIP-UL-AM
#
# Voice-over-IP UL traffic using RLC Acknowledged Mode (AM)
#
[Config VoIP-UL-AM]
extends=VoIP-UL

# The VoIP bearer runs RLC AM; a single QoS flow rides the default bearer, so it
# goes without an SDAP header
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 0, rlcMode: "AM"}]

# Use the NR RLC-AM entities for the AM data radio bearer (RLC mux architecture)
# (the NR RLC-AM entities are the default for NR bearers; no explicit selection needed)
#------------------------------------#



#------------------------------------#
# Config VoIP-DL-UM-NR
#
# Voice-over-IP DL traffic using the NR RLC Unacknowledged Mode (UM) entities
# on the RLC mux architecture. VoIP uses RLC-UM by default, so only the UM
# entity module types need to be swapped to the NR implementations.
#
[Config VoIP-DL-UM-NR]
extends=VoIP-DL

# (the NR RLC-UM entities are the default for NR bearers; no explicit selection needed)
#------------------------------------#



#------------------------------------#
# Config VoIP-UL-UM-NR
#
# Voice-over-IP UL traffic using the NR RLC Unacknowledged Mode (UM) entities.
#
[Config VoIP-UL-UM-NR]
extends=VoIP-UL

# (the NR RLC-UM entities are the default for NR bearers; no explicit selection needed)
#------------------------------------#


#------------------------------------#
# Config VoIP-DL-Rohc
#
# VoIP-DL with PDCP header compression (ROHC) on the bearer: the IP and UDP headers
# travel compressed. The bearer carries no SDAP header.
#
[Config VoIP-DL-Rohc]
extends = VoIP-DL
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 3, rlcMode: "UM", rohc: true}]
#------------------------------------#


#------------------------------------#
# Config Ipv6
#
# IPv6 PDU sessions: the UEs and the data network run IPv6 only, end to end; the
# transport network (the N3/N9 tunnels) stays IPv4, as GTP-U carries the sessions'
# packets as opaque payload. The UPF is the router on the sessions' IP link and
# answers the UEs' Neighbor Discovery.
#
[Config Ipv6]
abstract = true
*.ipv6Configurator.typename = "Ipv6NetworkConfigurator"
*.ipv6Configurator.config = xml("<config><interface hosts='**' prefix='2001:db8:0:x::/64'/></config>")
**.ipv6.configurator.networkConfiguratorModule = "ipv6Configurator"
*.ue[*].hasIpv4 = false
*.ue[*].hasIpv6 = true
*.server.hasIpv4 = false
*.server.hasIpv6 = true
*.router.hasIpv4 = false
*.router.hasIpv6 = true
*.upf.hasNdResponder = true
*.ue[*].sessionType = "IPv6"
#------------------------------------#


#------------------------------------#
# Config VoIP-DL-IPv6
#
# VoIP-DL over an IPv6 PDU session
#
[Config VoIP-DL-IPv6]
extends = VoIP-DL, Ipv6
#------------------------------------#


#------------------------------------#
# Config VoIP-UL-IPv6
#
# VoIP-UL over an IPv6 PDU session
#
[Config VoIP-UL-IPv6]
extends = VoIP-UL, Ipv6
#------------------------------------#


#------------------------------------#
# Config Ipv4v6
#
# IPv4v6 PDU sessions: the UEs and the data network run both IP versions, and one
# session carries both. Nothing on the way signals the version of a packet: each
# receiver reads it from the datagram itself.
#
[Config Ipv4v6]
abstract = true
extends = Ipv6
*.ue[*].hasIpv4 = true
*.server.hasIpv4 = true
*.router.hasIpv4 = true
*.ue[*].sessionType = "IPv4v6"
#------------------------------------#


#------------------------------------#
# Config VoIP-DL-IPv4v6
#
# Two Voice-over-IP DL flows to the UE on the same bearer of an IPv4v6 PDU
# session, one over IPv4 and one over IPv6
#
[Config VoIP-DL-IPv4v6]
extends = Standalone, Ipv4v6
*.ue[*].numApps = 2
*.server.numApps = 2
*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[*].localPort = 3000+ancestorIndex(0)
*.server.app[*].typename = "VoipSender"
*.server.app[*].packetSize = 40B
*.server.app[0].destAddress = "ue[0](ipv4)"
*.server.app[1].destAddress = "ue[0](ipv6)"
*.server.app[*].destPort = 3000+ancestorIndex(0)
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#------------------------------------#
# Config VoIP-UL-IPv4v6
#
# Two Voice-over-IP UL flows from the UE on the same bearer of an IPv4v6 PDU
# session, one over IPv4 and one over IPv6
#
[Config VoIP-UL-IPv4v6]
extends = Standalone, Ipv4v6
*.ue[*].numApps = 2
*.server.numApps = 2
*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 3000+ancestorIndex(0)
*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].packetSize = 40B
*.ue[*].app[0].destAddress = "server(ipv4)"
*.ue[*].app[1].destAddress = "server(ipv6)"
*.ue[*].app[*].destPort = 3000+ancestorIndex(0)
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].startTime = uniform(0s,0.02s)
#------------------------------------#


#------------------------------------#
# Config VoIP-DL-IPv6-Rohc
#
# VoIP-DL-IPv6 with PDCP header compression (ROHC) on the bearer: the IPv6 and UDP
# headers travel compressed
#
[Config VoIP-DL-IPv6-Rohc]
extends = VoIP-DL-IPv6
*.bearerConfigurator.onDemandDrbs = [{coreNetwork: "5gc", isDefault: true, suppressSdapHeader: true, lcg: 3, rlcMode: "UM", rohc: true}]
#------------------------------------#
