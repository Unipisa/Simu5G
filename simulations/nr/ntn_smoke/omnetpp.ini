[General]
sim-time-limit = 2s
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

*.configurator.config = xmldoc("demo.xml")

##### GEOGRAPHIC REFERENCE SYSTEM #####
*.geoRef.x = 0m
*.geoRef.y = 0m
*.geoRef.z = 0m
*.geoRef.referenceLatitude = 43.7deg
*.geoRef.referenceLongitude = 10.4deg
*.geoRef.referenceAltitude = 0m


##### NR NODES PARAMETERS #####
*.gnb.ntnGatewayId = 16384
*.gnb.satelliteId = 17408
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1


##### MOBILITY PARAMETERS #####
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 40000km
**.mobility.initFromDisplayString = false

*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 220m
*.gnb.mobility.initialZ = 0m
*.ntnGateway.mobility.initialX = 450m
*.ntnGateway.mobility.initialY = 350m
*.ntnGateway.mobility.initialZ = 0m
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 500m
*.ue[0].mobility.initialZ = 0m

##### NR NIC PARAMETERS #####
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

# enable local CSI computation (based on CSI RS)
*.ue[*].cellularNic.nrDlFbGen.computeCsiLocally = true

# enable transmission of CSI RS at the gNB
*.gnb.cellularNic.phy.csiRsPeriod = 10tti

# enable transmission of SRS
*.gnb.cellularNic.phy.srsPeriod = 10tti


##### APPLICATION PARAMETERS #####
*.ue[*].numApps = 2
*.server.numApps = 2

# Downlink server -> UE
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 10000

*.server.app[0].typename = "CbrSender"
*.server.app[0].localPort = 3088
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 10000
*.server.app[0].packetSize = 300B
*.server.app[0].samplingTime = 10ms
*.server.app[0].startTime = 0.05s

# Uplink UE -> server
*.server.app[1].typename = "CbrReceiver"
*.server.app[1].localPort = 10001

*.ue[*].app[1].typename = "CbrSender"
*.ue[*].app[1].localPort = 3089
*.ue[*].app[1].destAddress = "server"
*.ue[*].app[1].destPort = 10001
*.ue[*].app[1].packetSize = 300B
*.ue[*].app[1].samplingTime = 10ms
*.ue[*].app[1].startTime = 0.10s




[Config GeoSat]
network = simu5g.simulations.nr.ntn_smoke.NtnGeo
description = "NTN smoke test with one NR UE and one remote server exchanging CBR traffic through the gNB/GEO satellite path"

*.satellite.mobility.updateFromDisplayString = false
*.satellite.mobility.initFromDisplayString = false
*.satellite.mobility.initialLatitude = 0deg
*.satellite.mobility.initialLongitude = 25deg
*.satellite.mobility.initialAltitude = 35786km


[Config LeoSat]
network = simu5g.simulations.nr.ntn_smoke.NtnLeo
description = "NTN smoke test with one NR UE and one remote server exchanging CBR traffic through the gNB/LEO satellite path"

*.satelliteInserter.pathToTleFile = "space_Veins-1.txt"
*.satelliteInserter.ignoreUnknownSatellites = false
# The satellite must be above the local horizon of the ground nodes (43.7N, 10.4E) or no
# signal is received at all. This TLE describes a 350km circular orbit at 70deg inclination,
# whose visibility cap covers only 2.6% of the Earth at any instant, so the start time must
# be picked inside a pass. This one runs from 13:51:10 to 14:00:30 UTC and peaks at 31.8deg
# elevation (623km slant range) at 13:55:40. Later passes on the same day peak at 12.0deg
# (15:29:30), 4.4deg (21:53:00) and 68.1deg (23:27:10).
*.satelliteInserter.wall_clock_sim_start_time_utc = "2022-02-22-13-55-40"
*.leo*[*].mobility.updateDisplayString = true
*.leo*[*].mobility.updateInterval = 1s

# Dimension the RLC and RRC timers for the LEO round-trip delay (TR 38.821: 25.77ms)
# instead of the GEO default (541.46ms). One assignment covers both ends of every bearer:
# the NTN NICs and the NTN RLC entity types all declare this parameter under the same name.
**.ntnOrbitProfile = "LEO"


[Config GeoSatAm]
extends = GeoSat
description = "GeoSat with RLC AM, to exercise the NTN-dimensioned AM timers (the default UM path never reaches them)"

# Ip2Nic defaults every traffic class to UM, so the AM timers -- and the Radio Link Failure
# path they guard -- are unreachable in the standard configs.
#
# When RLF fires, the frames that were in flight at that moment keep arriving for a further
# round-trip time and find the MAC connections already deleted. The MAC now discards them
# instead of aborting the run (see the guards in LteMacUe/NrMacUe/LteMacEnbD2D); the
# terrestrial AM-RLF config in simulations/nr/rlc never exercises that, because nothing is
# in flight there.
#
# Measured, 30s limit: RLF at t=25.8s here, against t=4.4s with the terrestrial timers of
# GeoSatAmTerrestrialTimers -- a 5.9x improvement. RLF is delayed rather than avoided
# because the MAC-layer stall (unfixed per-TTI counters: HARQ pool, RAC, BSR) makes the
# real RLC status round trip far exceed the 541ms propagation delay the timers are sized
# for. AM over GEO will not be viable until those are addressed.
**.conversationalRlc = "AM"
**.streamingRlc = "AM"
**.interactiveRlc = "AM"
**.backgroundRlc = "AM"


[Config GeoSatAmTerrestrialTimers]
extends = GeoSatAm
description = "GeoSatAm with the terrestrial RLC timer defaults forced back, to show they cause Radio Link Failure much sooner over a satellite link"

# Every poll expires roughly seven times over before its STATUS report can physically
# arrive, so RETX_COUNT reaches maxRtxThreshold within a few poll periods and the bearer
# is released at both ends. This config exists to be compared against GeoSatAm.
**.t_PollRetransmit = 80ms
**.t_Reassembly = 80ms
**.t_StatusProhibit = 100ms
