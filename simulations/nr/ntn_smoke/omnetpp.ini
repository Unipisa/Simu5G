[General]
sim-time-limit = 2s
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

*.configurator.config = xmldoc("demo.xml")

##### GEOGRAPHIC REFERENCE SYSTEM #####
*.geoRef.x = 0m
*.geoRef.y = 0m
*.geoRef.z = 0m
*.geoRef.referenceLatitude = 43.7deg
*.geoRef.referenceLongitude = 10.4deg
*.geoRef.referenceAltitude = 0m


##### NR NODES PARAMETERS #####
*.gnb.ntnGatewayId = 16384
*.gnb.satelliteId = 17408
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1


##### MOBILITY PARAMETERS #####
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 40000km
**.mobility.initFromDisplayString = false

*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 220m
*.gnb.mobility.initialZ = 0m
*.ntnGateway.mobility.initialX = 450m
*.ntnGateway.mobility.initialY = 350m
*.ntnGateway.mobility.initialZ = 0m
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 500m
*.ue[0].mobility.initialZ = 0m

##### NR NIC PARAMETERS #####
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

# enable local CSI computation (based on CSI RS)
*.ue[*].cellularNic.nrDlFbGen.computeCsiLocally = true

# enable transmission of CSI RS at the gNB
*.gnb.cellularNic.phy.csiRsPeriod = 10tti

# enable transmission of SRS
*.gnb.cellularNic.phy.srsPeriod = 10tti


##### APPLICATION PARAMETERS #####
*.ue[*].numApps = 2
*.server.numApps = 2

# Downlink server -> UE
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 10000

*.server.app[0].typename = "CbrSender"
*.server.app[0].localPort = 3088
*.server.app[0].destAddress = "ue[0]"
*.server.app[0].destPort = 10000
*.server.app[0].packetSize = 300B
*.server.app[0].samplingTime = 10ms
*.server.app[0].startTime = 0.05s

# Uplink UE -> server
*.server.app[1].typename = "CbrReceiver"
*.server.app[1].localPort = 10001

*.ue[*].app[1].typename = "CbrSender"
*.ue[*].app[1].localPort = 3089
*.ue[*].app[1].destAddress = "server"
*.ue[*].app[1].destPort = 10001
*.ue[*].app[1].packetSize = 300B
*.ue[*].app[1].samplingTime = 10ms
*.ue[*].app[1].startTime = 0.10s




[Config GeoSat]
network = simu5g.simulations.nr.ntn_smoke.NtnGeo
description = "NTN smoke test with one NR UE and one remote server exchanging CBR traffic through the gNB/GEO satellite path"

*.satellite.mobility.updateFromDisplayString = false
*.satellite.mobility.initFromDisplayString = false
*.satellite.mobility.initialLatitude = 0deg
*.satellite.mobility.initialLongitude = 25deg
*.satellite.mobility.initialAltitude = 35786km


[Config LeoSat]
network = simu5g.simulations.nr.ntn_smoke.NtnLeo
description = "NTN smoke test with one NR UE and one remote server exchanging CBR traffic through the gNB/LEO satellite path"

*.satelliteInserter.pathToTleFile = "space_Veins-1.txt"
*.satelliteInserter.ignoreUnknownSatellites = false
# The satellite must be above the local horizon of the ground nodes (43.7N, 10.4E) or no
# signal is received at all. This TLE describes a 350km circular orbit at 70deg inclination,
# whose visibility cap covers only 2.6% of the Earth at any instant, so the start time must
# be picked inside a pass. This one runs from 13:51:10 to 14:00:30 UTC and peaks at 31.8deg
# elevation (623km slant range) at 13:55:40. Later passes on the same day peak at 12.0deg
# (15:29:30), 4.4deg (21:53:00) and 68.1deg (23:27:10).
*.satelliteInserter.wall_clock_sim_start_time_utc = "2022-02-22-13-55-40"
*.leo*[*].mobility.updateDisplayString = true
*.leo*[*].mobility.updateInterval = 1s

# No orbit is declared anywhere in this config. The RLC, RRC and MAC timers are dimensioned
# from the round-trip delay derived from this scenario's own geometry, so a LEO scenario gets
# LEO timers because its satellite is where it is -- not because a label says so.


[Config GeoSatAm]
extends = GeoSat
description = "GeoSat with RLC AM, to exercise the NTN-dimensioned AM timers (the default UM path never reaches them)"

# Ip2Nic defaults every traffic class to UM, so the AM timers -- and the Radio Link Failure
# path they guard -- are unreachable in the standard configs.
#
# When RLF fires, the frames in flight at that moment keep arriving for a further round-trip
# time and find their MAC connections and RLC entities already deleted. Both layers discard
# them instead of aborting the run (see the guards in LteMacUe/NrMacUe/LteMacEnbD2D and in
# RlcMux::fromMacLayer); the terrestrial AM-RLF config in simulations/nr/rlc never exercises
# that, because nothing is in flight there.
#
# This config no longer reaches RLF at all. With downlink HARQ feedback disabled the AM
# transmit window stops stalling, and a stalled window is the only route by which RETX_COUNT
# accumulates -- so AM over GEO is now viable, which it was not when the HARQ pool still
# capped delivery. To exercise the teardown paths deliberately, force a window stall:
#
#   -c GeoSatAm --**.AM_Window_Size=8 --**.maxRtxThreshold=1 --**.t_PollRetransmit=80ms
#
# which completes with one RLF and ten post-teardown discards. GeoSatAmTerrestrialTimers
# below still reaches RLF on its own and exercises the RLC-layer guards.
**.conversationalRlc = "AM"
**.streamingRlc = "AM"
**.interactiveRlc = "AM"
**.backgroundRlc = "AM"


[Config GeoSatAmTerrestrialTimers]
extends = GeoSatAm
description = "GeoSatAm with the terrestrial RLC timer defaults forced back, to show they cause Radio Link Failure much sooner over a satellite link"

# Every poll expires roughly seven times over before its STATUS report can physically
# arrive, so RETX_COUNT reaches maxRtxThreshold within a few poll periods and the bearer
# is released at both ends. This config exists to be compared against GeoSatAm, which with
# NTN-dimensioned timers no longer reaches RLF at all.
#
# It is also the regression test for the RLC-layer teardown guards: over 30s it produces one
# RLF followed by 26 dropped PDUs and 6 dropped SDU requests at RlcMux. Before those guards
# existed this configuration segfaulted in a release build.
**.t_PollRetransmit = 80ms
**.t_Reassembly = 80ms
**.t_StatusProhibit = 100ms

# NtnNrRlcAmTxEntity normally aborts the run when t_PollRetransmit does not cover the round
# trip, because a timer left at a terrestrial value is indistinguishable from a working one and
# the resulting RLF looks like a channel problem. Here the violation is the entire point of the
# configuration, so the check is turned off rather than the values being softened.
**.ntnCheckTimersCoverRoundTripDelay = false


##############################################################################
# MULTI-UE CONFIGURATIONS
#
# GeoSat and the three configs above run a single UE, which cannot show anything about
# resource-block contention: with one UE every allocation succeeds and the scheduler's
# mutual exclusion is never tested. These add UEs without touching GeoSat itself, so the
# recorded single-UE results stay comparable.
#
# Two things about the single-UE configs make them a weak baseline for uplink work, and
# both are addressed here rather than by editing GeoSat. The 2s limit is four GEO round
# trips, which says nothing about steady state; and one UE at 30kB/s never approaches the
# 50 available bands.
#
# The server carries one CbrReceiver at app[0] for all uplink flows and one CbrSender per
# UE after it, so these configs work at any numUe without renumbering: app[0] is matched
# explicitly and the app[*] patterns below therefore apply only from app[1] on.
##############################################################################

[Config GeoSatMultiUe]
extends = GeoSat
description = "GeoSat with four UEs over 30s, to exercise contention between UEs whose grants are in flight simultaneously"

# ~55 GEO round trips rather than the four that a 2s limit allows.
sim-time-limit = 30s

*.numUe = 4

# [General] pins these for ue[0] only. Restated for the whole vector, so every UE is
# placed deterministically rather than dropped at random inside the constraint area.
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].mobility.initialX = 400m + 30m * parentIndex()
*.ue[*].mobility.initialY = 500m
*.ue[*].mobility.initialZ = 0m

# One uplink receiver shared by every UE, then one downlink sender per UE.
*.server.numApps = 5
*.server.app[0].typename = "CbrReceiver"
*.server.app[0].localPort = 10001
*.server.app[*].typename = "CbrSender"
*.server.app[*].localPort = 3088 + index
*.server.app[*].destAddress = "ue[" + string(index - 1) + "]"
*.server.app[*].destPort = 10000
*.server.app[*].packetSize = 300B
*.server.app[*].samplingTime = 10ms
*.server.app[*].startTime = 0.05s

# Staggered, so the UEs do not all fire a random-access preamble in the same slot. The
# gNodeB collision window is a fixed one-slot bucket with no timing-advance model (see
# item 4 of ntn-implementation.md), so a synchronised start would measure that gap rather
# than the grant timing these configs exist to test.
*.ue[*].app[1].startTime = 0.10s + 0.017s * parentIndex()


[Config GeoSatMultiUeLoad]
extends = GeoSatMultiUe
description = "GeoSatMultiUe at eight UEs, past the point where the cell can carry the offered load"

# Twice the UEs at the same per-UE rate, rather than a higher rate on the same UEs. The
# allocator arbitrates between UEs, so UE count is what exercises it; raising the rate
# mostly grows queues.
#
# Calibrated against the measured GeoSatMultiUe result rather than picked: four UEs
# already draw about 75% of their offered 120kB/s, so the cell is close to its limit
# there. Eight UEs puts the offered load at roughly 2.5x what the cell carries, which is
# enough that every slot is contended without the run degenerating into unbounded queue
# growth -- there is no flow control here, so a heavily oversubscribed CBR source measures
# buffer depth rather than scheduling.
*.numUe = 8
*.server.numApps = 9

# NOT SEED-STABLE, and the reason is a pre-existing gap rather than a scenario defect.
# Compare runs only at equal seeds.
#
# At the default seed one UE is locked out of uplink entirely: ue[1] fires a preamble about
# every RAR window for the whole run (59 of them, one byte each) and never obtains an
# uplink grant, while its downlink runs at the full offered rate. At --seed-set=1 every UE
# transmits, but the per-UE uplink share still spreads about fourfold.
#
# This is the preamble-collision gap recorded in item 4 of ntn-implementation.md: the
# gNodeB collision window is a fixed one-slot bucket with no round-trip term, so under
# differential delay UEs that transmit in the same slot need not collide while UEs that
# transmit slots apart may collide spuriously. Closing it needs the timing-advance model,
# not a scenario change. It is invisible with one UE, which is why it surfaces here.


[Config GeoSatSpreadUe]
extends = GeoSatMultiUe
description = "GeoSatMultiUe with the UEs spread over hundreds of kilometres, so their one-way delays differ by whole slots"

# GeoSatMultiUe puts its UEs inside the default 1km area, where the spread in one-way
# delay is about 3us -- zero slots, so every UE has the same timing and differential delay
# is not exercised at all. Spreading them over 450km gives something over a millisecond,
# which is a whole slot at numerology 0.
#
# This is the configuration in which a pre-attach grant can land in a slot booked for
# another UE, because a UE the gNodeB has not yet heard from can only be given the
# cell-wide worst case. Fixing that properly needs the beam and coverage model of item 5;
# see ~NtnNrMacGnb.
**.mobility.constraintAreaMaxX = 700km
*.ue[*].mobility.initialX = 450m + 150km * parentIndex()
