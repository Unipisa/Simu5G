[General]
network = EthernetSessions
sim-time-limit = 5s
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5
*.configurator.config = xmldoc("../standalone/demo.xml")

*.gnb1.mobility.initialX = 450m
*.gnb1.mobility.initialY = 300m
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1
*.ue[*].mobility.initialX = 450m + 30m * ancestorIndex(1)
*.ue[*].mobility.initialY = 350m

# The data network's Ethernet LAN, and the devices behind UEs: raw Ethernet hosts on the
# layered Ethernet stack (INET), with 802.1Q; their applications need socket support
*.dnStation.hasIpv4 = false
*.device[*].hasIpv4 = false
*.dnStation.eth[*].typename = "LayeredEthernetInterface"
*.device[*].eth[*].typename = "LayeredEthernetInterface"
*.dnStation.ethernet.typename = "EthernetLayer"
*.device[*].ethernet.typename = "EthernetLayer"
*.dnStation.ieee8021q.typename = "Ieee8021qProtocol"
*.device[*].ieee8021q.typename = "Ieee8021qProtocol"
*.dnStation.ethernet.hasSocketSupport = true
*.device[*].ethernet.hasSocketSupport = true
*.dnStation.llc.typename = ""
*.device[*].llc.typename = ""
**.eth[*].bitrate = 1Gbps
*.upf.dnEth.bitrate = 1Gbps

# The UEs of Ethernet sessions: no IP layer, raw Ethernet applications on the NIC
*.ue[*].sessionType = "Ethernet"
*.ue[*].hasIpv4 = false


#------------------------------------#
# Config Ethernet-Hosts
#
# Two UEs with Ethernet sessions in host mode and a station on the data network's
# Ethernet LAN, exchanging raw Ethernet frames through the UPF's bridge: ue[0] sends to
# dnStation (via N6), dnStation to ue[1], ue[1] to ue[0] (switched between the two
# sessions at the UPF, not via N6), and dnStation broadcasts. Each node counts what it
# receives (the sink apps).
#
[Config Ethernet-Hosts]
description = "two UEs in Ethernet host mode and a station on the N6 Ethernet LAN, switched at the UPF's bridge"
*.numUe = 2
*.ue[*].numApps = 2
*.dnStation.numApps = 3
**.app[0].typename = "EthernetSourceApp"
**.app[0].source.packetLength = 100B
**.app[0].source.productionInterval = 20ms
**.app[0].source.initialProductionOffset = 0.1s
*.ue[*].app[0].io.interface = "cellular"
*.dnStation.app[0].io.interface = "eth0"
*.ue[0].app[0].io.remoteAddress = "dnStation"
*.ue[1].app[0].io.remoteAddress = "ue[0]"
*.dnStation.app[0].io.remoteAddress = "ue[1]"
**.app[1].typename = "EthernetSinkApp"
**.app[1].io.steal = true
*.ue[*].app[1].io.interface = "cellular"
*.ue[0].app[1].io.localAddress = "ue[0]"
*.ue[1].app[1].io.localAddress = "ue[1]"
*.dnStation.app[1].io.interface = "eth0"
*.dnStation.app[1].io.localAddress = "dnStation"
*.dnStation.app[2].typename = "EthernetSourceApp"
*.dnStation.app[2].io.interface = "eth0"
*.dnStation.app[2].io.remoteAddress = "FF-FF-FF-FF-FF-FF"
*.dnStation.app[2].source.packetLength = 64B
*.dnStation.app[2].source.productionInterval = 100ms
*.dnStation.app[2].source.initialProductionOffset = 0.15s


#------------------------------------#
# Config Ethernet-Bridge
#
# ue[0] is an Ethernet bridge for the device behind it (a UE in bridge mode). The device
# and dnStation exchange VLAN 42 frames of two priorities, PCP 5 and PCP 0. QoS rules on
# the frames put PCP 5 on QoS flow 5, carried by DRB 2, and the rest on the default QoS
# flow and DRB 1: the UE's uplink rules (ulQfiRules) and the UPF's downlink rules
# (dlQfiRules) both classify by the frame's 802.1Q priority (TS 23.501 5.7.6.3).
#
[Config Ethernet-Bridge]
description = "a UE in Ethernet bridge mode with a device behind it, 802.1Q priorities mapped to two QoS flows and DRBs"
*.numUe = 1
*.numDevices = 1
*.ue[0].ethernetMode = "bridge"
*.ue[0].numEthInterfaces = 1
*.bearerConfigurator.staticDrbs = [
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 1, isDefault: true, lcg: 3, rlcMode: "UM"},
    {coreNetwork: "5gc", ue: "ue[0]", drbId: 2, mappedQfis: [5], lcg: 1, rlcMode: "UM"}
    ]
*.bearerConfigurator.ulQfiRules = [{ue: "ue[0]", filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5}]
*.bearerConfigurator.dlQfiRules = [{filter: "expr(has(ieee8021qctag) && ieee8021qctag.pcp == 5)", qfi: 5}]
*.device[0].numApps = 3
*.dnStation.numApps = 3
**.app[0..1].typename = "EthernetSourceApp"
**.app[0..1].source.packetLength = 100B
**.app[0..1].source.productionInterval = 20ms
**.app[0..1].source.initialProductionOffset = 0.1s + 5ms * ancestorIndex(1)
**.app[0..1].io.interface = "eth0"
**.app[0..1].tagger.typename = "PacketTagger"
**.app[0..1].tagger.vlanId = 42
**.app[0..1].tagger.encapsulationProtocols = ["ieee8021qctag"]
**.app[0].tagger.pcp = 5
**.app[1].tagger.pcp = 0
*.device[0].app[0..1].io.remoteAddress = "dnStation"
*.dnStation.app[0..1].io.remoteAddress = "device[0]"
**.app[2].typename = "EthernetSinkApp"
**.app[2].io.interface = "eth0"
**.app[2].io.steal = true
*.device[0].app[2].io.localAddress = "device[0]"
*.dnStation.app[2].io.localAddress = "dnStation"


#------------------------------------#
# Config Ethernet-Handover
#
# Config Ethernet-Hosts' ue[0] and dnStation, while ue[0] moves from one gNB to the other:
# the downlink the source gNB holds when the UE leaves is forwarded to the target over X2
# on the session's forwarding tunnel. The session keeps its anchor and its port at the
# UPF's bridge, so what the bridge learned stays valid (SSC mode 1).
#
[Config Ethernet-Handover]
description = "an Ethernet session across a handover between two gNBs (X2 forwarding)"
*.hasSecondGnb = true
*.gnb1.mobility.initialX = 250m
*.gnb1.mobility.initialY = 500m
*.gnb2.mobility.initialX = 750m
*.gnb2.mobility.initialY = 500m
*.gnb*.numX2Apps = 1
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false
**.dynamicCellAssociation = true
**.enableHandover = true
*.numUe = 1
*.ue[0].mobility.typename = "LinearMobility"
*.ue[0].mobility.initialX = 420m
*.ue[0].mobility.initialY = 500m
*.ue[0].mobility.initialMovementHeading = 0deg
*.ue[0].mobility.speed = 30mps
*.ue[0].numApps = 2
*.dnStation.numApps = 2
**.app[0].typename = "EthernetSourceApp"
**.app[0].source.packetLength = 100B
**.app[0].source.productionInterval = 20ms
**.app[0].source.initialProductionOffset = 0.1s
*.ue[0].app[0].io.interface = "cellular"
*.ue[0].app[0].io.remoteAddress = "dnStation"
*.dnStation.app[0].io.interface = "eth0"
*.dnStation.app[0].io.remoteAddress = "ue[0]"
**.app[1].typename = "EthernetSinkApp"
**.app[1].io.steal = true
*.ue[0].app[1].io.interface = "cellular"
*.ue[0].app[1].io.localAddress = "ue[0]"
*.dnStation.app[1].io.interface = "eth0"
*.dnStation.app[1].io.localAddress = "dnStation"


#------------------------------------#
# Config Ethernet-Mixed
#
# One UPF anchors all three kinds of session: ue[0] exchanges Ethernet frames with
# dnStation, ue[1] sends voice to the server over an IPv4 session, and ue[2] sends
# Unstructured payload to the server's echo application over its N6 tunnel (IPv4).
#
[Config Ethernet-Mixed]
description = "Ethernet, IPv4 and Unstructured sessions at one UPF"
*.numUe = 3
*.ue[1].sessionType = "IPv4"
*.ue[1].hasIpv4 = true
*.ue[2].sessionType = "Unstructured"
*.configurator.config = xml("<config> \
    <interface among='gnb* upf*' address='10.x.x.x' netmask='255.255.255.0'/> \
    <interface hosts='*' address='192.168.x.x' netmask='255.255.255.0'/> \
    <route hosts='router' destination='10.99.0.0' netmask='255.255.0.0' interface='ppp1'/> \
    </config>")
*.ue[0].numApps = 2
*.dnStation.numApps = 2
*.ue[0].app[0].typename = "EthernetSourceApp"
*.ue[0].app[0].source.packetLength = 100B
*.ue[0].app[0].source.productionInterval = 20ms
*.ue[0].app[0].source.initialProductionOffset = 0.1s
*.ue[0].app[0].io.interface = "cellular"
*.ue[0].app[0].io.remoteAddress = "dnStation"
*.dnStation.app[0].typename = "EthernetSourceApp"
*.dnStation.app[0].source.packetLength = 100B
*.dnStation.app[0].source.productionInterval = 20ms
*.dnStation.app[0].source.initialProductionOffset = 0.1s
*.dnStation.app[0].io.interface = "eth0"
*.dnStation.app[0].io.remoteAddress = "ue[0]"
*.ue[0].app[1].typename = "EthernetSinkApp"
*.dnStation.app[1].typename = "EthernetSinkApp"
*.ue[0].app[1].io.steal = true
*.dnStation.app[1].io.steal = true
*.ue[0].app[1].io.interface = "cellular"
*.ue[0].app[1].io.localAddress = "ue[0]"
*.dnStation.app[1].io.interface = "eth0"
*.dnStation.app[1].io.localAddress = "dnStation"
*.ue[1].numApps = 1
*.ue[1].app[0].typename = "VoipSender"
*.ue[1].app[0].destAddress = "server"
*.ue[1].app[0].destPort = 3000
*.ue[1].app[0].localPort = 3088
*.ue[2].numUnstructuredApps = 1
*.ue[2].unstructuredApp[0].source.packetLength = 100B
*.ue[2].unstructuredApp[0].source.productionInterval = 20ms
*.ue[2].unstructuredApp[0].source.initialProductionOffset = 0.1s
*.server.numApps = 2
*.server.app[0].typename = "VoipReceiver"
*.server.app[0].localPort = 3000
*.server.app[1].typename = "UdpEchoApp"
*.server.app[1].localPort = 5000
*.upf.nodeControl.unstructuredPrefix = "10.99.0.0/16"
*.upf.nodeControl.unstructuredServer = "server"
*.upf.nodeControl.unstructuredServerPort = 5000
*.upf.nodeControl.unstructuredPort = 5001
