# Settings every module test shares; a test's omnetpp.ini includes this file
[General]
cmdenv-express-mode = true
sim-time-limit = 1s
**.vector-recording = false
**.scalar-recording = false

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm

# the base station at (450m, 300m), the UEs in front of it
**.gnb.mobility.initialX = 450m
**.gnb.mobility.initialY = 300m
**.eNB.mobility.initialX = 450m
**.eNB.mobility.initialY = 300m
**.ue[*].mobility.initialX = 450m + 30m * ancestorIndex(1)
**.ue[*].mobility.initialY = 350m

# the serving cells: an NR UE attaches to the gNB, an LTE UE to the eNB
NrSessionTestNetwork.ue[*].servingNodeId = 0
NrSessionTestNetwork.ue[*].nrServingNodeId = 1
EpcSessionTestNetwork.ue[*].servingNodeId = 1

# the UPF's Ethernet N6 link (with hasEthernetBridge), which INET's layered Ethernet
# interface needs a bitrate for
**.upf.ethBridge.dnEth.bitrate = 1Gbps
