# Builds the website (doc/src) with the NED and C++ references of the latest release, and deploys it
# to GitHub Pages. See doc/src/README.
name: Build and deploy the website to GitHub Pages

on:
  push:
    branches: ["deployed-website"]

  workflow_dispatch:
    inputs:
      doc_version:
        description: 'Release whose NED documentation to include (X.Y.Z); empty means the latest release'
        required: false
        type: string

# Do not cancel an in-progress deployment, but skip the runs queued between it and the latest one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the website
        uses: actions/checkout@v7

      - name: Determine the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DOC_VERSION: ${{ inputs.doc_version }}
        run: |
          if [ -z "$DOC_VERSION" ]; then
            DOC_VERSION=$(gh release view --repo Unipisa/Simu5G --json tagName --jq '.tagName' | sed -e 's/^v//')
          fi
          echo "Using the NED documentation of release v$DOC_VERSION"
          echo "version=$DOC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          repository: Unipisa/Simu5G
          ref: v${{ steps.release.outputs.version }}
          path: release

      # the INET version that the CI of the release builds against
      - name: Determine the INET version
        id: inet
        run: |
          ref=$(awk '/repository: inet-framework\/inet/ { inet = 1 } inet && /ref:/ { print $2; exit }' \
                release/.github/workflows/fingerprint-tests.yml)
          if ! [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no INET version (ref: vX.Y.Z) in the fingerprint-tests.yml of the release"
            exit 1
          fi
          echo "Using INET $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "doc-url=https://inet.omnetpp.org/docs/$(echo "${ref#v}" | cut -d. -f1,2)/api/types" >> "$GITHUB_OUTPUT"

      - name: Checkout INET
        uses: actions/checkout@v7
        with:
          repository: inet-framework/inet
          ref: ${{ steps.inet.outputs.ref }}
          path: inet
          sparse-checkout: src

      - name: Insert the version into the NED documentation
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: grep -rlZ --include='*.ned' '@VERSION@' release | xargs -0r sed -i -e "s/@VERSION@/$VERSION/g"

      - name: Build the website
        uses: omnetpp/doc-builder@v1
        with:
          project-dir: release
          sphinx-source: doc/src
          ned-dir: neddoc
          title: Simu5G
          doxygen: true
          ned-path: inet/src
          external-docs: inet=${{ steps.inet.outputs.doc-url }}
          # the comments link to types with ~, not every word that happens to be a type name
          docgen-args: --no-automatic-hyperlinks
          # GitHub Pages serves the pages also without the .html suffix
          sphinx-args: >-
            -D html_link_suffix=
            -D release=${{ steps.release.outputs.version }}
            -D version=${{ steps.release.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
